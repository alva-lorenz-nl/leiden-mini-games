<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莱顿逻辑馆 · 小猫斑马谜题</title>
<meta name="description" content="阿尔瓦写的逻辑谜题生成器，小猫专属的斑马游戏。三档难度、自动计时、档案可跨设备同步，每一题都保证唯一解。">
<meta name="tag" content="逻辑 · 推理">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#141110;--card:#1e1915;--card2:#241d17;--line:#3a2f24;--ink:#e9dfd0;
    --dim:#9a8b78;--amber:#e0a458;--amber2:#c98a3f;--good:#7fa86a;--bad:#c96a5a;
  }
  body{background:radial-gradient(circle at 50% 0%,#221b15,#141110 60%);color:var(--ink);
    font-family:"Noto Serif SC",Georgia,"Songti SC",serif;min-height:100vh;padding:26px 14px 70px;
    display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(880px,100%)}
  header{text-align:center;margin-bottom:22px}
  .kicker{font-size:10px;letter-spacing:.34em;color:var(--amber2);margin-bottom:10px}
  h1{font-size:23px;font-weight:600;letter-spacing:.1em}
  .sub{margin-top:8px;font-size:12px;color:var(--dim);letter-spacing:.06em}
  .rule{width:44px;height:1px;background:var(--line);margin:18px auto 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;
    transition:.18s;letter-spacing:.06em}
  .btn:hover{border-color:#5c4630;color:var(--amber)}
  .btn.primary{background:linear-gradient(180deg,#3a2c1d,#2a2015);border-color:#5c4630;color:var(--amber)}
  .btn.on{border-color:var(--amber2);color:var(--amber);background:#2e2418}
  .btn:disabled{opacity:.45;cursor:default}
  .label{font-size:11px;letter-spacing:.2em;color:var(--dim);margin:16px 0 9px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:12px;color:var(--dim);margin-bottom:12px;letter-spacing:.06em}
  .timer{font-variant-numeric:tabular-nums;color:var(--amber);font-size:14px}
  .intro{font-size:12.5px;color:var(--dim);line-height:1.9;margin-bottom:14px;white-space:pre-line}

  table{border-collapse:separate;border-spacing:5px;width:100%;table-layout:fixed}
  th{font-size:10.5px;color:var(--dim);font-weight:400;letter-spacing:.08em;padding-bottom:2px}
  th.rowh{text-align:right;padding-right:8px;color:var(--amber2);width:64px;font-size:11px}
  td{padding:0}
  .cell{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;
    background:#1a1512;color:var(--ink);font-family:inherit;font-size:12px;cursor:pointer;
    transition:.15s;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell:hover{border-color:#5c4630}
  .cell.filled{background:#2b2118;color:var(--amber)}
  .cell.empty{color:#57483a}
  .cell:focus-visible{outline:2px solid var(--amber2);outline-offset:1px}
  .cell.wrong{border-color:var(--bad);color:var(--bad);animation:shake .3s}
  .cell.right{border-color:var(--good);color:var(--good)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  .clues{margin-top:16px;font-size:12.5px;line-height:2.05;color:#cbbca6}
  .clues li{display:flex;gap:8px;align-items:baseline;margin-left:20px;padding-left:2px;transition:.2s}
  .clues li::marker{color:#6b5a44;font-size:11px}
  .clues .clue-status{flex:0 0 14px;font-size:11px;color:#6b5a44;line-height:1}
  .clues .clue-text{flex:1}
  .clues li.satisfied .clue-status{color:var(--good)}
  .clues li.satisfied .clue-text{color:#8d8a7d}
  .clues li.conflict .clue-status{color:var(--bad)}
  .clues li.conflict .clue-text{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
  .q{margin-top:16px;padding:12px 14px;border-left:2px solid var(--amber2);
    background:#221a13;border-radius:0 8px 8px 0;font-size:13px;color:var(--amber)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .msg{font-size:12.5px;letter-spacing:.05em;min-height:18px}
  .msg.ok{color:var(--good)} .msg.no{color:var(--bad)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .stat b{display:block;font-size:19px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim);letter-spacing:.1em}

  .picker{position:fixed;inset:0;display:none;z-index:50}
  .picker.on{display:block}
  .picker .box{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;width:min(260px,88vw);max-height:64vh;overflow:auto;
    box-shadow:0 16px 40px rgba(0,0,0,.55);animation:pop .13s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .picker .tt{font-size:11px;color:var(--dim);letter-spacing:.14em;margin-bottom:10px;text-align:center}
  .picker .opt{display:block;width:100%;text-align:center;margin-bottom:5px;padding:8px 10px;
    background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-family:inherit;font-size:12.5px;cursor:pointer}
  .picker .opt:hover{border-color:var(--amber2);color:var(--amber)}
  .picker .opt.on{border-color:var(--amber2);color:var(--amber);background:#2b2118}
  .picker .opt.used{opacity:.42}
  .picker .opt.clr{color:var(--dim);font-size:11.5px;margin-top:2px;margin-bottom:0}

  textarea{width:100%;height:76px;background:#1a1512;border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:11px;
    padding:10px;resize:vertical;line-height:1.6}
  .cal{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-top:10px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-title{font-size:12.5px;letter-spacing:.14em;color:var(--amber)}
  .cal-nav{font-family:inherit;font-size:13px;color:var(--dim);background:transparent;border:1px solid var(--line);
    border-radius:8px;width:28px;height:26px;cursor:pointer;line-height:1;transition:.15s}
  .cal-nav:hover:not(:disabled){border-color:#5c4630;color:var(--amber)}
  .cal-nav:disabled{opacity:.3;cursor:default}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:430px;margin:0 auto}
  .cal-wd{font-size:10px;color:var(--dim);text-align:center;letter-spacing:.06em;padding-bottom:2px}
  .cal-day{position:relative;height:40px;display:flex;align-items:center;justify-content:center;
    font-family:inherit;font-size:12px;color:var(--dim);background:#1a1512;border:1px solid var(--line);
    border-radius:9px;cursor:pointer;transition:.15s;font-variant-numeric:tabular-nums;padding:0}
  .cal-day:hover:not(:disabled):not(.blank){border-color:#5c4630;color:var(--amber)}
  .cal-day.done{background:#2a2216;border-color:#6b5330;color:var(--amber)}
  .cal-day.today{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 1px rgba(224,164,88,.35) inset}
  .cal-day.today .mk{right:4px;top:5px;width:12px;height:12px}
  .cal-day.future{opacity:.32;cursor:default;background:#161211}
  .cal-day.future:hover{border-color:var(--line);color:var(--dim)}
  .cal-day.blank{background:transparent;border:none;cursor:default}
  .cal-day .mk{position:absolute;right:3px;top:2px;width:13px;height:13px;color:var(--amber);opacity:.95;
    filter:drop-shadow(0 0 2px rgba(224,164,88,.55))}
  .cal-day .mk svg{width:100%;height:100%;display:block;fill:currentColor}
  .cal-foot{margin-top:10px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between;
    align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:.06em}
  .hidden{display:none!important}
  .hist{font-size:11.5px;color:var(--dim);line-height:1.9;margin-top:10px;max-height:150px;overflow:auto}
  footer{margin-top:30px;text-align:center;font-size:11px;color:#5f5546;letter-spacing:.1em}
#puzzleList{max-height:350px;overflow:auto;display:grid;gap:8px;margin-top:12px} #puzzleList button{text-align:left} @media(max-width:550px){table{min-width:520px}} .table-scroll{overflow-x:auto}
</style>
</head>

<div class="wrap">
  <header>

<button class="btn on" data-mode="free">自由推理</button><button class="btn" data-mode="story">故事模式</button><button class="btn" data-mode="daily">每日挑战</button></div>

        </div>
      </div>
    </div>
  </section>

  <!-- 谜题 -->
  <section id="game" class="hidden">
    <div class="card">
      <div class="meta">
        <div id="gameTitle">—</div>
        <div class="timer" id="timer">00:00</div>
      </div>
      <div class="intro" id="intro"></div>
      <div class="table-scroll"><table id="grid"></table></div>
      <div class="q" id="question"></div>
      <div class="foot">
        <div class="msg" id="gameMsg"></div>
        <div class="row">
          <button class="btn" id="giveUpBtn">看答案</button>
          <button class="btn" id="backBtn">回首页</button>
          <button class="btn primary" id="checkBtn">提交检查</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="label">线索</div>
      <ol class="clues" id="clues"></ol>
    </div>
  </section>

  <footer>莱顿小游戏柜 · 慢慢做，慢慢加</footer>
</div>

<div class="picker" id="picker">
  <div class="box">
    <div class="tt" id="pickerTitle"></div>
    <div id="pickerOpts"></div>
    <button class="btn" style="width:100%;margin-top:4px" id="pickerClose">取消</button>
  </div>
</div>

const META = BANK.meta, PUZ = BANK.puzzles;

const THEME_NAMES = {}; Object.keys(META).forEach(k=>THEME_NAMES[k]=META[k].title);
const DIFF_NAMES = {easy:"简单", normal:"普通", hard:"困难"};

/* 把精简题库还原成页面用的结构 */
function hydrate(p, theme, diff){
  const cats = {};
  p.k.forEach(c=> cats[c] = META[theme].cats[c]);
  return {
    id:p.id, theme_key:theme, theme:META[theme].title, intro:p.i || META[theme].intro,
    difficulty:diff, categories:cats, clue_count:p.n, clues:p.c,
    question:p.q, answer:p.a, solution:p.s, r:p.r || []
  };
}

const S = {
  theme: localStorage.getItem("zebra_theme") || "cat",
  diff: localStorage.getItem("zebra_diff") || "easy",
  cur: null,       // 当前题目
  assign: null,    // {类别: [null x5]}
  t0: 0, timerId: null, elapsed: 0, solved: false,
};

/* ---------------- 档案 ---------------- */
function loadRec(){
  try{
    const raw = localStorage.getItem("zebra_records");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {solved:{}, history:[], done:[]};
}
function saveRec(r){ localStorage.setItem("zebra_records", JSON.stringify(r)); }
let REC = loadRec();
let mode="free", chapter=0;
let playDay = null;   // 日历里点开的那一天（补做）
let calMonth = null;  // {y, m(0起)}

function fmt(sec){
  sec = Math.round(sec);
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function renderStats(){
  renderModes();
  const box = document.getElementById("statBox");
  box.innerHTML = "";
  ["easy","normal","hard"].forEach(d=>{
    const s = REC.solved[d] || {n:0, best:null, total:0};
    const avg = s.n ? fmt(s.total/s.n) : "—";
    const el = document.createElement("div");
    el.className = "stat";
    el.innerHTML = `<b>${s.n} 题</b><span>${DIFF_NAMES[d]} · 最快 ${s.best==null?"—":fmt(s.best)} · 平均 ${avg}</span>`;
    box.appendChild(el);
  });
  const h = document.getElementById("histBox");
  if(!REC.history.length){ h.textContent = "还没有记录。做一题，这里就会留下痕迹。"; }
  else{
    h.innerHTML = REC.history.slice(0,12).map(x=>
      `· ${x.time}　${THEME_NAMES[x.theme]||x.theme} / ${DIFF_NAMES[x.diff]||x.diff}　${x.ok?"完成":"查看答案"} · 用时 ${fmt(x.sec)}`).join("<br>");
  }
}

/* ---------------- 首页 ---------------- */
function renderChoices(){
  const tr = document.getElementById("themeRow");
  tr.innerHTML = "";
  Object.keys({all:"不限主题",...THEME_NAMES}).forEach(k=>{
    const b = document.createElement("button");
    b.className = "btn" + (S.theme===k?" on":"");
    b.textContent = k==="all"?"不限主题":THEME_NAMES[k];
    b.onclick = ()=>{ S.theme=k; localStorage.setItem("zebra_theme",k); renderChoices(); renderList(); };
    tr.appendChild(b);
  });
  const dr = document.getElementById("diffRow");
  dr.innerHTML = "";
  Object.keys({all:"不限难度",...DIFF_NAMES}).forEach(k=>{
    const b = document.createElement("button");
    b.className = "btn" + (S.diff===k?" on":"");
    b.textContent = k==="all"?"不限难度":DIFF_NAMES[k];
    b.onclick = ()=>{ S.diff=k; localStorage.setItem("zebra_diff",k); renderChoices(); renderList(); };
    dr.appendChild(b);
  });
}

function pickPuzzle(){
  if(mode === "story"){
    const ch=CHAPTERS[chapter];
    return hydrate(PUZ[ch.theme+"_"+ch.diff][ch.index],ch.theme,ch.diff);
  }
  if(mode === "daily"){
    // Stable date index: independent daily bank, sixty days before cycling.
    const key = playDay || dayKey();
    const day=Math.floor(Date.parse(key+"T00:00:00Z")/86400000);
    const list=BANK.daily;
    const item=list[((day%list.length)+list.length)%list.length];
    return hydrate(item,item.theme,item.diff);
  }
  const pool=filteredPuzzles().filter(p=>!REC.done.includes(p.id));
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;

}

/* ---------------- 谜题 ---------------- */
function startGame(selected){
  const p = selected && selected.id ? selected : pickPuzzle();
  if(!p){ document.getElementById("homeMsg").textContent = "当前筛选下没有未做题了；请放宽条件，或从题目列表选择重玩。"; return; }
  S.cur = p; S.mode=mode; S.chapter=chapter; S.day=(mode==="daily"&&playDay)?playDay:dayKey(); S.recorded=false;
  playDay = null;
  S.assign = {};
  Object.keys(p.categories).forEach(c=> S.assign[c] = new Array(5).fill(null));
  S.solved = false;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("gameTitle").textContent =
    `${THEME_NAMES[p.theme_key]||p.theme} · ${DIFF_NAMES[p.difficulty]||p.difficulty} · ${p.clue_count} 条线索`;
  document.getElementById("intro").textContent = S.mode==="story" ? CHAPTERS[S.chapter].intro : (S.mode==="daily"?S.day+" 每日挑战（北京时间）。 ":"")+p.intro;
  document.getElementById("question").textContent = "追问：" + p.question;
  document.getElementById("gameMsg").textContent = "";
  document.getElementById("gameMsg").className = "msg";
  document.getElementById("checkBtn").disabled = false;
  document.getElementById("giveUpBtn").disabled = false;

  renderClues();
  renderGrid();
  startTimer();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderGrid(){
  const p = S.cur, tb = document.getElementById("grid");
  updateClues();
  tb.innerHTML = "";
  const head = document.createElement("tr");
  head.appendChild(document.createElement("th"));
  for(let i=1;i<=5;i++){
    const th = document.createElement("th");
    th.textContent = "第"+i+"位";
    head.appendChild(th);
  }
  tb.appendChild(head);

  Object.keys(p.categories).forEach(cat=>{
    const tr = document.createElement("tr");
    const rh = document.createElement("th");
    rh.className = "rowh";
    rh.textContent = cat;
    tr.appendChild(rh);
    for(let i=0;i<5;i++){
      const td = document.createElement("td");
      const v = S.assign[cat][i];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cell" + (v ? " filled" : " empty");
      b.dataset.cat=cat;b.dataset.idx=i;
      b.setAttribute("aria-label",cat+"，第"+(i+1)+"位"+(v?"："+v:"：空"));
      b.textContent = v || "·";
      b.disabled=S.solved;
      b.onclick=ev=>{ ev.stopPropagation(); openPicker(cat,i,b); };
      td.appendChild(b);
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
}

let pickerCtx = null;
function openPicker(cat, idx, anchor){
  if(S.solved) return;
  pickerCtx = {cat, idx};
  document.getElementById("pickerTitle").textContent = `${cat} · 第 ${idx+1} 位`;
  const box = document.getElementById("pickerOpts");
  box.innerHTML = "";
  S.cur.categories[cat].forEach(v=>{
    const usedAt = S.assign[cat].indexOf(v);
    const b = document.createElement("button");
    b.className = "opt" + (S.assign[cat][idx]===v ? " on" : "") + (usedAt>=0 && usedAt!==idx ? " used" : "");
    b.textContent = v;
    if(usedAt>=0 && usedAt!==idx) b.title = `已在第 ${usedAt+1} 位`;
    b.onclick = ()=>{ setCell(cat, idx, v); closePicker(); };
    box.appendChild(b);
  });
  const c = document.createElement("button");
  c.className = "opt clr";
  c.textContent = "清空这一格";
  c.onclick = ()=>{ setCell(cat, idx, null); closePicker(); };
  box.appendChild(c);
  const p = document.getElementById("picker");
  p.classList.add("on");
  positionPicker(p.querySelector(".box"), anchor);
}
/* 面板贴着被点的那一格，靠近边缘时自动收进视口 */
function positionPicker(panel, anchor){
  if(!panel) return;
  const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = panel.offsetWidth || 240, h = panel.offsetHeight || 220;
  let left, top;
  if(!r){ left = (vw-w)/2; top = (vh-h)/2; }
  else {
    left = r.left + r.width/2 - w/2;
    top = r.bottom + 6;
    if(top + h > vh - 8) top = Math.max(8, r.top - h - 6);
    left = Math.max(8, Math.min(left, vw - w - 8));
  }
  panel.style.left = left + "px";
  panel.style.top = top + "px";
}
function closePicker(){ document.getElementById("picker").classList.remove("on"); pickerCtx=null; }

/* 线索状态：只看玩家自己填的内容，不读答案 */
function clueState(clue, assign){
  const N = 5;
  function slots(cat, val){
    const row = assign[cat] || [];
    const i = row.indexOf(val);
    return i >= 0 ? [i+1] : row.flatMap((v,k)=> v ? [] : [k+1]);
  }
  const kind = clue[0];
  if(kind === "edge"){
    const [, c, v, side] = clue;
    const want = side === "left" ? 1 : N;
    if(assign[c] && assign[c].includes(v)) return assign[c][want-1] === v ? "satisfied" : "conflict";
    return "pending";
  }
  if(kind === "pos"){
    const [, c, v, p] = clue;
    if(assign[c] && assign[c].includes(v)) return assign[c][p-1] === v ? "satisfied" : "conflict";
    return "pending";
  }
  let c1, v1, c2, v2, test;
  if(kind === "same"){ [, c1, v1, c2, v2] = clue; test = (a,b)=> a===b; }
  else if(kind === "next"){ [, c1, v1, c2, v2] = clue; test = (a,b)=> b === a+1; }
  else if(kind === "left"){ [, c1, v1, c2, v2] = clue; test = (a,b)=> a < b; }
  else if(kind === "gap"){ [, c1, v1, c2, v2] = clue; const g = clue[5]+1; test = (a,b)=> Math.abs(a-b) === g; }
  else return "pending";
  const A = slots(c1, v1), B = slots(c2, v2);
  const possible = A.some(a=> B.some(b=> !(c1===c2 && v1!==v2 && a===b) && test(a,b)));
  if(!possible) return "conflict";
  const both = (assign[c1]||[]).includes(v1) && (assign[c2]||[]).includes(v2);
  return both && test(assign[c1].indexOf(v1)+1, assign[c2].indexOf(v2)+1) ? "satisfied" : "pending";
}

function renderClues(){
  const list = document.getElementById("clues");
  list.innerHTML = "";
  (S.cur.clues || []).forEach(t=>{
    const li = document.createElement("li");
    const st = document.createElement("span");
    st.className = "clue-status";
    const tx = document.createElement("span");
    tx.className = "clue-text";
    tx.textContent = t;
    li.append(st, tx);
    list.appendChild(li);
  });
  updateClues();
}

function updateClues(){
  if(!S.cur) return;
  const raw = S.cur.r || [];
  const sym = {pending:"□", satisfied:"✓", conflict:"✕"};
  const tip = {pending:"待确定", satisfied:"已满足", conflict:"与当前填表冲突"};
  document.querySelectorAll("#clues li").forEach((li, i)=>{
    const st = raw[i] ? clueState(raw[i], S.assign) : "pending";
    li.className = st;
    li.dataset.state = st;
    const dot = li.querySelector(".clue-status");
    if(dot) dot.textContent = sym[st];
    li.title = tip[st];
  });
}

function setCell(cat, idx, v){
  if(S.solved)return;
  // 同一类别里同一个值只能出现一次，若重复则清掉原来那格
  if(v){
    const old = S.assign[cat].indexOf(v);
    if(old >= 0 && old !== idx) S.assign[cat][old] = null;
  }
  S.assign[cat][idx] = v;
  renderGrid();
  updateClues();
}

function startTimer(){
  clearInterval(S.timerId);
  S.t0 = Date.now(); S.elapsed = 0;
  document.getElementById("timer").textContent = "00:00";
  S.timerId = setInterval(()=>{
    S.elapsed = (Date.now()-S.t0)/1000;
    document.getElementById("timer").textContent = fmt(S.elapsed);
  }, 250);
}
function stopTimer(){ clearInterval(S.timerId); S.timerId = null; }

function check(){
  if(S.solved) return;
  const p = S.cur;
  let allFilled = true, wrong = 0;
  Object.keys(p.categories).forEach(cat=>{
    p.categories[cat].forEach((v,i)=>{
      const mine = S.assign[cat][i];
      if(!mine){ allFilled = false; return; }
      if(mine !== p.solution[cat][i]) wrong++;
    });
  });
  const msg = document.getElementById("gameMsg");
  if(!allFilled){
    msg.className = "msg no";
    msg.textContent = "还有空格没填。慢慢来，不急。";
    return;
  }
  if(wrong > 0){
    msg.className = "msg no";
    msg.textContent = `有 ${wrong} 格不对。线索是够用的，再推一推。`;
    // 标红错误格
    document.querySelectorAll(".cell").forEach(b=>{
      const cat=b.dataset.cat, i=+b.dataset.idx, v=S.assign[cat][i];
      if(v && v !== p.solution[cat][i]) b.classList.add("wrong");
    });
    return;
  }
  // 全对
  S.solved = true;
  stopTimer();
  document.getElementById("checkBtn").disabled = true;
  document.getElementById("giveUpBtn").disabled = true;
  msg.className = "msg ok";
  msg.textContent = `全对！用时 ${fmt(S.elapsed)}。${p.question} —— 答案是「${p.answer.value}」。`;
  document.querySelectorAll(".cell").forEach(b=>{b.classList.add("right");b.disabled=true;});
  record(S.elapsed, true);
}

function giveUp(){
  if(S.solved) return;
  const p = S.cur;
  S.solved = true;
  stopTimer();
  Object.keys(p.categories).forEach(cat=>{
    S.assign[cat] = p.solution[cat].slice();
  });
  renderGrid();
  document.querySelectorAll(".cell").forEach(b=>{b.classList.add("right");b.disabled=true;});
  document.getElementById("checkBtn").disabled = true;
  document.getElementById("giveUpBtn").disabled = true;
  const msg = document.getElementById("gameMsg");
  msg.className = "msg";
  msg.textContent = `答案是：${p.answer.value}。${p.question}`;
  record(S.elapsed, false);
}

function record(sec, ok){
  if(S.recorded) return;
  S.recorded=true;
  REC.story=REC.story||[]; REC.daily=REC.daily||[];
  if(ok && S.mode==="story" && !REC.story.includes(S.chapter)) REC.story.push(S.chapter);
  if(ok && S.mode==="daily" && !REC.daily.includes(S.day)) REC.daily.push(S.day);
  if(ok && S.mode==="story") document.getElementById("gameMsg").textContent += " "+CHAPTERS[S.chapter].ending;

  const p = S.cur;
  const d = p.difficulty;
  if(!REC.solved[d]) REC.solved[d] = {n:0,best:null,total:0};
  if(ok && !(REC.wins||[]).includes(p.id)){
    REC.wins=REC.wins||[]; REC.wins.push(p.id);
    const s = REC.solved[d];
    s.n++; s.total += sec;
    s.best = s.best==null ? sec : Math.min(s.best, sec);
  }
  if(!REC.done.includes(p.id)) REC.done.push(p.id);
  const now = new Date();
  REC.history.unshift({
    time: `${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`,
    theme: p.theme_key, diff: d, sec: Math.round(sec), ok, mode:S.mode
  });
  REC.history = REC.history.slice(0, 60);
  saveRec(REC);
  renderStats();
  if(mode==='daily') renderModes();
}

/* ---------------- 同步码 ---------------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b=>bin += String.fromCharCode(b));
  return btoa(bin).replace(/=+$/,"");
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s/g,""));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function checksum(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function doExport(){
  const payload = JSON.stringify({...REC,v:2});
  const body = b64enc(payload);
  const code = "ZBR1-" + body + "-" + checksum(body);
  const box = document.getElementById("syncBox");
  box.classList.remove("hidden");
  document.getElementById("syncLabel").textContent = "同步码（复制到别的设备粘贴导入）";
  document.getElementById("syncText").value = code;
  document.getElementById("syncText").select();
  try{ document.execCommand("copy"); }catch(e){}
}
function doImport(){
  const box = document.getElementById("syncBox");
  box.classList.remove("hidden");
  document.getElementById("syncLabel").textContent = "把另一台设备的同步码粘进来";
  document.getElementById("syncText").value = "";
  document.getElementById("syncText").focus();
}
function syncConfirm(){
  const txt = document.getElementById("syncText").value.trim();
  if(!txt) return;
  if(txt.startsWith("ZBR1-")){
    const body = txt.slice(5);
    const cut = body.lastIndexOf("-");
    if(cut < 0) return alert("同步码不完整。");
    const payload = body.slice(0, cut), sum = body.slice(cut+1);
    if(checksum(payload) !== sum) return alert("同步码校验失败，可能复制时漏了字符。");
    try{
      const data = JSON.parse(b64dec(payload));
      REC.solved = data.solved || {};
      REC.done = data.done || [];
      REC.history = data.history || [];
      REC.story = data.story || []; REC.daily = data.daily || []; REC.wins = data.wins || [];
      saveRec(REC); renderStats();
      document.getElementById("syncBox").classList.add("hidden");
      alert("档案已导入。");
    }catch(e){ alert("同步码解析失败。"); }
  } else {
    alert("这不像是一个同步码。");
  }
}

function dayKey(){return new Date(Date.now()+8*3600000).toISOString().slice(0,10);}

/* ---------------- 每日挑战日历 ---------------- */
const PAW_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="5.4" ry="4.3"/><ellipse cx="5.6" cy="11.2" rx="2.2" ry="2.7" transform="rotate(-18 5.6 11.2)"/><ellipse cx="9.6" cy="7.6" rx="2.1" ry="2.8" transform="rotate(-8 9.6 7.6)"/><ellipse cx="14.4" cy="7.6" rx="2.1" ry="2.8" transform="rotate(8 14.4 7.6)"/><ellipse cx="18.4" cy="11.2" rx="2.2" ry="2.7" transform="rotate(18 18.4 11.2)"/></svg>';
function todayParts(){
  const t=new Date(Date.now()+8*3600000);
  return {y:t.getUTCFullYear(), m:t.getUTCMonth(), d:t.getUTCDate()};
}
function keyOf(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

function renderCalendar(){
  const box=document.getElementById('dailyCal');
  box.classList.toggle('hidden', mode!=='daily');
  if(mode!=='daily') return;
  const t=todayParts(), todayK=dayKey();
  if(!calMonth) calMonth={y:t.y, m:t.m};
  const first=new Date(Date.UTC(calMonth.y,calMonth.m,1));
  const days=new Date(Date.UTC(calMonth.y,calMonth.m+1,0)).getUTCDate();
  const pad=(first.getUTCDay()+6)%7;   // 周一开头
  const done=REC.daily||[];
  box.innerHTML='';

  const head=document.createElement('div'); head.className='cal-head';
  const prev=document.createElement('button'); prev.className='cal-nav'; prev.textContent='‹';
  prev.setAttribute('aria-label','上个月');
  prev.onclick=()=>{ calMonth={y:calMonth.y, m:calMonth.m-1}; if(calMonth.m<0) calMonth={y:calMonth.y-1, m:11}; renderCalendar(); };
  const title=document.createElement('div'); title.className='cal-title';
  title.textContent=`${calMonth.y} 年 ${calMonth.m+1} 月`;
  const next=document.createElement('button'); next.className='cal-nav'; next.textContent='›';
  next.setAttribute('aria-label','下个月');
  next.disabled=(calMonth.y===t.y && calMonth.m===t.m);
  next.onclick=()=>{ if(next.disabled) return; calMonth={y:calMonth.y, m:calMonth.m+1}; if(calMonth.m>11) calMonth={y:calMonth.y+1, m:0}; renderCalendar(); };
  head.append(prev,title,next);

  const grid=document.createElement('div'); grid.className='cal-grid';
  ['一','二','三','四','五','六','日'].forEach(w=>{
    const el=document.createElement('div'); el.className='cal-wd'; el.textContent=w; grid.appendChild(el);
  });
  for(let i=0;i<pad;i++){ const el=document.createElement('div'); el.className='cal-day blank'; grid.appendChild(el); }

  let monthDone=0;
  for(let d=1; d<=days; d++){
    const k=keyOf(calMonth.y, calMonth.m, d);
    const b=document.createElement('button'); b.className='cal-day'; b.textContent=d;
    const isDone=done.includes(k), isFuture=k>todayK;
    if(isDone){ b.classList.add('done'); monthDone++; const mk=document.createElement('span'); mk.className='mk'; mk.innerHTML=PAW_SVG; b.appendChild(mk); }
    if(k===todayK) b.classList.add('today');
    if(isFuture){ b.classList.add('future'); b.disabled=true; b.title='还没到这一天'; }
    else{
      b.title = isDone ? `${k} · 已完成，可重玩` : `${k} · 点开作答`;
      b.onclick = ()=>{ playDay=k; startGame(); };
    }
    grid.appendChild(b);
  }

  const foot=document.createElement('div'); foot.className='cal-foot';
  const info=document.createElement('span');
  info.textContent=`本月 ${monthDone} 天 · 累计 ${done.length} 天`;
  const back=document.createElement('button'); back.className='btn';
  back.style.cssText='font-size:11px;padding:4px 10px';
  back.textContent='回到今天';
  back.onclick=()=>{ calMonth={y:t.y, m:t.m}; renderCalendar(); };
  foot.append(info,back);
  box.append(head,grid,foot);
}

    if(S.theme!=='all'&&theme!==S.theme || S.diff!=='all'&&diff!==S.diff)continue;
    items.forEach(p=>out.push(hydrate(p,theme,diff)));

}
