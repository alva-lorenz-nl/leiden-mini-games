<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>莱顿逻辑馆 · 小猫斑马谜题</title>
    <meta
      name="description"
      content="阿尔瓦写的逻辑谜题生成器，小猫专属的斑马游戏。三档难度、自动计时、档案可跨设备同步，每一题都保证唯一解。"
    />
    <meta name="tag" content="逻辑 · 推理" />
    <style>
      * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  --bg: #141110;
  --card: #1e1915;
  --card2: #241d17;
  --line: #3a2f24;
  --ink: #e9dfd0;
  --dim: #9a8b78;
  --amber: #e0a458;
  --amber2: #c98a3f;
  --good: #7fa86a;
  --bad: #c96a5a;
}
body {
  background: radial-gradient(circle at 50% 0%, #221b15, #141110 60%);
  color: var(--ink);
  font-family: "Noto Serif SC", Georgia, "Songti SC", serif;
  min-height: 100vh;
  padding: 26px 14px 70px;
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  width: min(880px, 100%);
}
header {
  text-align: center;
  margin-bottom: 22px;
}
.kicker {
  font-size: 10px;
  letter-spacing: 0.34em;
  color: var(--amber2);
  margin-bottom: 10px;
}
h1 {
  font-size: 23px;
  font-weight: 600;
  letter-spacing: 0.1em;
}
.sub {
  margin-top: 8px;
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 0.06em;
}
.rule {
  width: 44px;
  height: 1px;
  background: var(--line);
  margin: 18px auto 22px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 18px 16px;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 16px;
  cursor: pointer;
  transition: 0.18s;
  letter-spacing: 0.06em;
}
.btn:hover {
  border-color: #5c4630;
  color: var(--amber);
}
.btn.primary {
  background: linear-gradient(180deg, #3a2c1d, #2a2015);
  border-color: #5c4630;
  color: var(--amber);
}
.btn.on {
  border-color: var(--amber2);
  color: var(--amber);
  background: #2e2418;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.label {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--dim);
  margin: 16px 0 9px;
}
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 12px;
  letter-spacing: 0.06em;
}
.timer {
  font-variant-numeric: tabular-nums;
  color: var(--amber);
  font-size: 14px;
}
.intro {
  font-size: 12.5px;
  color: var(--dim);
  line-height: 1.9;
  margin-bottom: 14px;
}

table {
  border-collapse: separate;
  border-spacing: 5px;
  width: 100%;
  table-layout: fixed;
}
th {
  font-size: 10.5px;
  color: var(--dim);
  font-weight: 400;
  letter-spacing: 0.08em;
  padding-bottom: 2px;
}
th.rowh {
  text-align: right;
  padding-right: 8px;
  color: var(--amber2);
  width: 64px;
  font-size: 11px;
}
td {
  padding: 0;
}
.cell {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #1a1512;
  color: var(--ink);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: 0.15s;
  letter-spacing: 0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cell:hover {
  border-color: #5c4630;
}
.cell.filled {
  background: #2b2118;
  color: var(--amber);
}
.cell.wrong {
  border-color: var(--bad);
  color: var(--bad);
  animation: shake 0.3s;
}
.cell.right {
  border-color: var(--good);
  color: var(--good);
}
@keyframes shake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-3px);
  }
  75% {
    transform: translateX(3px);
  }
}

.clues {
  margin-top: 16px;
  font-size: 12.5px;
  line-height: 2.05;
  color: #cbbca6;
}
.clues li {
  margin-left: 20px;
  padding-left: 2px;
}
.clues li::marker {
  color: #6b5a44;
  font-size: 11px;
}
.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.msg {
  font-size: 12.5px;
  letter-spacing: 0.05em;
  min-height: 18px;
}
.msg.ok {
  color: var(--good);
}
.msg.no {
  color: var(--bad);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 6px;
}
.stat {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px 14px;
}
.stat b {
  display: block;
  font-size: 19px;
  color: var(--amber);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.stat span {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.1em;
}
textarea {
  width: 100%;
  height: 76px;
  background: #1a1512;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  padding: 10px;
  resize: vertical;
  line-height: 1.6;
}
.hidden {
  display: none !important;
}
.hist {
  font-size: 11.5px;
  color: var(--dim);
  line-height: 1.9;
  margin-top: 10px;
  max-height: 150px;
  overflow: auto;
}
footer {
  margin-top: 30px;
  text-align: center;
  font-size: 11px;
  color: #5f5546;
  letter-spacing: 0.1em;
}
select.cell {
  padding: 0 4px;
  white-space: normal;
  color-scheme: dark;
}
#puzzleList {
  max-height: 350px;
  overflow: auto;
  display: grid;
  gap: 8px;
  margin-top: 12px;
}
#puzzleList button {
  text-align: left;
}
@media (max-width: 550px) {
  table {
    min-width: 520px;
  }
}
.table-scroll {
  overflow-x: auto;
}

.clue-scroll {
  max-height: min(42vh, 360px);
  overflow-y: auto;
  overscroll-behavior-y: contain;
  scrollbar-gutter: stable;
  padding-right: 6px;
  scrollbar-width: thin;
  scrollbar-color: #574434 transparent;
}
.clue-scroll:focus-visible {
  outline: 2px solid var(--amber2);
}
.clues .clue-status {
  display: inline-block;
  width: 1.6em;
  text-decoration: none;
}
.clues .satisfied .clue-text {
  text-decoration: line-through;
  opacity: 0.55;
}
.clues .satisfied .clue-status {
  color: #73d99a;
}
.clues .conflict {
  color: #ff777f;
}

.clue-scroll::-webkit-scrollbar {
  width: 6px;
}
.clue-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.clue-scroll::-webkit-scrollbar-thumb {
  background: #49392c;
  border-radius: 8px;
}
.clue-scroll:hover::-webkit-scrollbar-thumb {
  background: #6b5037;
}
.clue-scroll .clues {
  margin-top: 2px;
}
.clues li {
  padding-top: 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid rgba(154, 139, 120, 0.09);
}
.clues li:last-child {
  border-bottom: none;
}
.clues .satisfied .clue-status {
  color: var(--good);
}
.clues .conflict {
  color: #dd8677;
}
.card {
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
}
.cell:focus-visible,
.btn:focus-visible {
  outline: 2px solid var(--amber2);
  outline-offset: 2px;
}
/* 故事档案 */
.story-box {
  margin-top: 14px;
  padding: 14px 16px;
  border: 1px solid #3a2f24;
  border-radius: 10px;
  background: #1c1712;
}
.story-box .label {
  margin-top: 10px;
}
.story-box .label:first-child {
  margin-top: 0;
}
.story-box .frag {
  margin: 8px 0 0;
  font-size: 13px;
  line-height: 1.85;
  color: var(--dim);
}
.story-box .frag b {
  color: var(--amber);
  font-weight: 500;
}
.story-box .ending {
  margin: 8px 0 0;
  font-size: 13px;
  line-height: 1.9;
  color: var(--amber);
}
#storyTags .row {
  margin-top: 4px;
}

.stage-heading {
  flex-basis: 100%;
  margin: 14px 0 4px;
  font-weight: 600;
}
#storyStages {
  margin-bottom: 14px;
}

.table-hint {
  display: none;
  font-size: 12px;
  color: var(--dim);
}
@media (max-width: 700px) {
  .table-hint {
    display: block;
  }
}

/* ===== v4 界面调整：参考 zebrapuzzles 的棋盘与随填随查 ===== */
.gamebar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.gamebar #gameTitle {
  font-size: 14px;
  letter-spacing: 0.06em;
  color: var(--ink);
}
.gb-right {
  display: flex;
  gap: 8px;
}
.chip {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #1a1512;
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.08em;
}
.chip b {
  font-size: 13px;
  font-weight: 600;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.progress {
  height: 3px;
  margin: 12px 0 2px;
  border-radius: 99px;
  background: #241d17;
  overflow: hidden;
}
.progress i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: linear-gradient(90deg, #8a6132, var(--amber));
  transition: width 0.25s ease;
}
th.colh {
  text-align: center;
  padding-bottom: 6px;
}
.colnum {
  display: block;
  font-size: 11px;
  color: var(--amber2);
  letter-spacing: 0.06em;
}
.collabel {
  display: block;
  font-size: 9.5px;
  color: var(--dim);
  opacity: 0.75;
  margin-top: 1px;
}
th.corner {
  width: 64px;
}
.cell {
  height: 44px;
  border-radius: 10px;
  font-size: 12.5px;
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1a1512;
}
.cell.empty {
  color: #4a3f33;
  font-size: 14px;
}
.cell.empty:hover {
  color: var(--amber2);
  background: #201a14;
}
.cell.filled {
  background: linear-gradient(180deg, #2f251a, #281f16);
  color: var(--amber);
  border-color: #4d3b28;
}
.cell.focus {
  outline: 2px solid var(--amber2);
  outline-offset: 1px;
}
.cell.hinted {
  border-style: dashed;
  border-color: #6d8f9c;
  color: #a8c6d2;
}
.cell.right {
  background: #232019;
}

.picker {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(8, 6, 5, 0.45);
  backdrop-filter: blur(2px);
}
.picker[hidden] {
  display: none;
}
.picker-box {
  position: absolute;
  width: min(300px, 92vw);
  max-height: 70vh;
  overflow: auto;
  padding: 10px;
  border: 1px solid #4a3a2a;
  border-radius: 13px;
  background: #201a15;
  box-shadow: 0 18px 46px rgba(0, 0, 0, 0.5);
}
.picker-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 4px 8px;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--dim);
}
.picker-x {
  border: 0;
  background: none;
  color: var(--dim);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
}
.picker-x:hover {
  color: var(--amber);
}
.picker-opts {
  display: grid;
  gap: 6px;
}
.opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #241d17;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: 0.15s;
}
.opt:hover {
  border-color: var(--amber2);
  color: var(--amber);
}
.opt.on {
  border-color: var(--amber2);
  background: #2e2418;
  color: var(--amber);
}
.opt.used .opt-t {
  opacity: 0.55;
}
.opt-note {
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.04em;
}
.opt.clear {
  justify-content: center;
  color: var(--dim);
  font-size: 12px;
}
.opt.clear:hover {
  color: var(--bad);
  border-color: var(--bad);
}
@media (max-width: 550px) {
  .chip {
    padding: 4px 8px;
  }
  .cell {
    height: 40px;
    font-size: 11.5px;
  }
  .opt {
    padding: 12px;
  }
}

/* 手机上不再横向滚动：五列压缩到一屏 */
@media (max-width: 550px) {
  table {
    min-width: 0;
    border-spacing: 3px;
  }
  th.rowh,
  th.corner {
    width: 46px;
    font-size: 10px;
    padding-right: 2px;
  }
  th.colh .collabel {
    display: none;
  }
  .cell {
    height: 42px;
    padding: 0 2px;
    border-radius: 8px;
    font-size: 10.5px;
    letter-spacing: 0;
  }
  .progress {
    height: 4px;
  }
}
.progress i {
  box-shadow: 0 0 8px rgba(224, 164, 88, 0.35);
}

/* 追问卡：通关后在剧情区里问一句，选对才放出这一层 */
.ask {
  border-left: 2px solid var(--amber2);
  background: linear-gradient(90deg, rgba(224, 164, 88, 0.06), transparent);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px 14px;
}
.ask .label {
  margin: 0;
}
.ask-text {
  margin: 6px 0 10px;
  font-size: 13.5px;
  color: var(--amber);
  letter-spacing: 0.02em;
}
.ask-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.ask-opt {
  min-width: 84px;
}
.ask-opt.wrong {
  opacity: 0.4;
  text-decoration: line-through;
}
.ask-note {
  margin: 10px 0 0;
  font-size: 11.5px;
  color: var(--dim);
  letter-spacing: 0.04em;
}
.ask-note.ok {
  color: var(--good);
}
.ask-note.bad {
  color: #d08a7a;
}

/* 六列题：值更长，格子允许换行并缩一档 */
.cell {
  white-space: normal;
  line-height: 1.15;
  text-align: center;
  word-break: break-all;
}
table.dense .cell {
  font-size: 11px;
  padding: 0 2px;
}
@media (max-width: 550px) {
  table.dense .cell {
    font-size: 9px;
    height: 46px;
  }
  table.dense th.rowh,
  table.dense th.corner {
    width: 40px;
    font-size: 9px;
  }
  table.dense {
    border-spacing: 2px;
  }
}

/* 做不了的选项：灰掉且点不动 */
.btn.off,
.btn:disabled {
  opacity: 0.34;
  cursor: not-allowed;
  border-color: #2f2620;
  color: #7d7266;
  box-shadow: none;
}
.btn.off:hover,
.btn:disabled:hover {
  border-color: #2f2620;
  background: transparent;
}
.btn.on:disabled {
  opacity: 0.5;
}

/* 滚动条也按馆里的木头色来 */
#puzzleList,
.clue-scroll,
textarea,
body {
  scrollbar-width: thin;
  scrollbar-color: #574434 transparent;
}
#puzzleList::-webkit-scrollbar,
textarea::-webkit-scrollbar,
body::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
#puzzleList::-webkit-scrollbar-track,
textarea::-webkit-scrollbar-track,
body::-webkit-scrollbar-track {
  background: transparent;
}
#puzzleList::-webkit-scrollbar-thumb,
textarea::-webkit-scrollbar-thumb,
body::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #4a3a2c, #3a2d23);
  border-radius: 8px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
#puzzleList::-webkit-scrollbar-thumb:hover,
textarea::-webkit-scrollbar-thumb:hover,
body::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #6b5037, #4a3a2c);
  background-clip: padding-box;
}
#puzzleList {
  padding-right: 6px;
  /* 上下淡出，暗示还能往下滚 */
  mask-image: linear-gradient(
    to bottom,
    transparent 0,
    #000 14px,
    #000 calc(100% - 14px),
    transparent 100%
  );
}

    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="kicker">LEIDEN LOGIC ROOM</div>
        <h1>小猫斑马谜题</h1>
        <div class="sub">阿尔瓦写的逻辑生成器 · 每题唯一解</div>
        <div class="rule"></div>
      </header>

      <!-- 首页 -->
      <section id="home">
        <div class="card">
          <div class="label">玩法</div>
          <div class="row">
            <button class="btn on" data-mode="free">自由推理</button
            ><button class="btn" data-mode="story">故事模式</button
            ><button class="btn" data-mode="daily">每日挑战</button>
          </div>
          <p class="intro" id="modeInfo"></p>
          <div id="chapters" class="row"></div>
          <div id="storyTags" class="hidden">
            <div class="label">故事标签</div>
            <div class="row" id="tagRow"></div>
          </div>
          <div id="freeFilters">
            <div class="label">主题</div>
            <div class="row" id="themeRow"></div>
            <div class="label">难度</div>
            <div class="row" id="diffRow"></div>
          </div>
          <div id="dailyArchive" class="hidden"></div>
          <div class="foot">
            <div class="msg" id="homeMsg" role="status"></div>
            <button class="btn" id="listBtn">题目列表</button
            ><button class="btn primary" id="startBtn">随机未做题 →</button>
          </div>
        </div>

        <div id="puzzleList" class="hidden"></div>
        <div class="card" style="margin-top: 14px">
          <div class="label">成就</div>
          <div id="achievements" class="stats"></div>
          <div class="label">档案</div>
          <div class="stats" id="statBox"></div>
          <div class="hist" id="histBox"></div>
          <div class="foot">
            <div class="row">
              <button class="btn" id="exportBtn">导出同步码</button>
              <button class="btn" id="importBtn">导入同步码</button>
            </div>
            <button class="btn" id="clearBtn">清空档案</button>
          </div>
          <div id="syncBox" class="hidden" style="margin-top: 12px">
            <div class="label" id="syncLabel">
              同步码（复制到别的设备粘贴导入）
            </div>
            <textarea id="syncText" spellcheck="false"></textarea>
            <div class="row" style="margin-top: 8px">
              <button class="btn" id="syncDo">确认</button>
              <button class="btn" id="syncCancel">取消</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 谜题 -->
      <section id="game" class="hidden">
        <div class="card">
          <div class="gamebar">
            <div class="gb-left">
              <div id="gameTitle">—</div>
            </div>
            <div class="gb-right">
              <div class="chip">
                <span>线索</span><b id="clueProgress">0/0</b>
              </div>
              <div class="chip">
                <span>用时</span><b class="timer" id="timer">00:00</b>
              </div>
            </div>
          </div>
          <div class="progress" aria-hidden="true"><i id="clueBar"></i></div>
          <p class="intro" id="intro"></p>
          <p class="table-hint">点格子选内容，线索会随填表自动更新。</p>
          <div

/* 把精简题库还原成页面用的结构 */
function hydrate(p, theme, diff) {
  const cats = {};
  p.k.forEach((c) => (cats[c] = META[theme].cats[c]));
  return {
    id: p.id,
    theme_key: theme,
    theme: META[theme].title,
    intro: META[theme].intro,
    difficulty: diff,
    categories: cats,
    clue_count: p.n,
    clues: softenClues(p.c, p.r, theme),
    rawClues: p.r,
    question: p.q,
    answer: p.a,
    solution: p.s,
  };
}

/* 早期题库里“状态=喝咖啡”和“饮料=热水”会拼出别扭的句子，这里改写成人话 */
function softenClues(texts, raws, theme) {
  if (theme !== "alva" || !raws) return texts;
  const key = ["状态", "饮料"].sort().join("|");
  return texts.map((t, i) => {
    const r = raws[i];
    if (r && r[0] === "same" && [r[1], r[3]].sort().join("|") === key)
      return `正在${r[2]}的人，杯子里装的其实是${r[4]}。`;
    return t;
  });
}

/* 把故事章节的谜题还原成页面用的结构 */
function hydrateStory(ch, i) {
  const p = ch.puzzle;
  return {
    id: p.id,
    theme_key: "story",
    theme: ch.title,
    chapterIndex: i,
    intro: p.intro,
    difficulty: p.diff,
    categories: p.cats,
    colLabels: p.cols || null,
    clue_count: p.c.length,
    clues: p.c,
    rawClues: p.r,
    question: p.q,
    answer: p.a,
    solution: p.s,
    fragments: p.frag || [],
    ending: p.end,
  };
}

/* ===== 在线题目生成器（SAT/约束传播 + 线索精简） =====
 * 思路参考开源实现（joshhills/logic-puzzle-generator、tuchandra/zebra）：
 * 1. 随机生成一个合法解；
 * 2. 收集所有在该解下为真的候选线索；
 * 3. 以“删除后是否仍唯一解”为判据，逐条剔除冗余线索，得到最小线索集；
 * 4. 按难度补回若干线索，再用中文模板渲染成题面。
 */
const GEN = (() => {
  const N = 5;
  const FULL = (1 << N) - 1;

  /* 可复现随机数：同一 seed 在任何设备上生成同一道题 */
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function popcount(x) {
    let c = 0;
    while (x) {
      x &= x - 1;
      c++;
    }
    return c;
  }

  /* 每个主题每类属性的“主语形式”与“谓语形式”，用于把抽象线索写成中文 */
  const PHRASE = {
    cat: {
      名字: { noun: "{v}", pred: "是{v}", q: "{v}是谁？" },
      毛色: {
        noun: "毛色是{v}的小猫",
        pred: "的毛色是{v}",
        q: "毛色是{v}的小猫是谁？",
      },
      零食: {
        noun: "爱吃{v}的小猫",
        pred: "爱吃{v}",
        q: "爱吃{v}的小猫是谁？",
      },
      活动: {
        noun: "正在{v}的小猫",
        pred: "正在{v}",
        q: "正在{v}的小猫是谁？",
      },
      窝: { noun: "窝在{v}的小猫", pred: "窝在{v}", q: "窝在{v}的小猫是谁？" },
    },
    alva: {
      人物: { noun: "{v}", pred: "是{v}", q: "{v}是谁？" },
      房间: { noun: "{v}", pred: "在{v}里", q: "{v}里的人是谁？" },
      手里东西: {
        noun: "有{v}的房间",
        pred: "有{v}",
        q: "谁在有{v}的房间里？",
        roomish: true,
      },
      衣领颜色: {
        noun: "衣领是{v}的人",
        pred: "的衣领是{v}",
        q: "衣领是{v}的人是谁？",
      },
      饮料: { noun: "喝{v}的人", pred: "喝{v}", q: "喝{v}的人是谁？" },
    },
  };

  /* 这两类属性描述的是“房间”，与其它属性拼句时要多一层“里的人” */
  function isRoomish(themeKey, cat) {
    return cat === "房间" || !!PHRASE[themeKey][cat].roomish;
  }

  /* 语义上互斥/容易产生怪句子的属性对，不生成“同一格”线索 */
  const AVOID_SAME = [];

  /* 字面上有交集的取值（咖啡杯 / 黑咖啡）拼在一句里容易别扭，直接跳过 */
  function gramClash(a, b) {
    if (a === b) return true;
    if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return true;
    const g = (t) => {
      const set = new Set();
      for (let i = 0; i + 1 < t.length; i++) set.add(t.slice(i, i + 2));
      return set;
    };
    const ga = g(a);
    for (const x of g(b)) if (ga.has(x)) return true;
    return false;
  }

  function pairKey(a, b) {
    return [a, b].sort().join("|");
  }

  const AVOID = new Set(AVOID_SAME.map((p) => pairKey(p[0], p[1])));

  /* ---------- 约束求解：位掩码域 + 传播 + MRV 回溯，只数到 limit 个解 ---------- */
  function propagate(dom, clues, nc) {
    let changed = true;
    while (changed) {
      changed = false;
      /* 每类属性内部：每个取值恰好出现一次 */
      for (let c = 0; c < nc; c++) {
        const row = dom[c];
        for (let p = 0; p < N; p++) if (!row[p]) return false;
        for (let p = 0; p < N; p++) {
          if (popcount(row[p]) === 1) {
            for (let q = 0; q < N; q++)
              if (q !== p && row[q] & row[p]) {
                row[q] &= ~row[p];
                if (!row[q]) return false;
                changed = true;
              }
          }
        }
        /* 唯一候选：某取值只剩一个位置可放 */
        for (let v = 0; v < N; v++) {
          const bit = 1 << v;
          let only = -1,
            cnt = 0;
          for (let p = 0; p < N; p++)
            if (row[p] & bit) {
              only = p;
              cnt++;
            }
          if (!cnt) return false;
          if (cnt === 1 && popcount(row[only]) > 1) {
            row[only] = bit;
            changed = true;
          }
        }
      }
      /* 线索传播 */
      for (const cl of clues) {
        const da = dom[cl.a],
          db = dom[cl.b];
        const ba = 1 << cl.va,
          bb = 1 << cl.vb;
        if (cl.kind === "same") {
          for (let p = 0; p < N; p++) {
            if (!(da[p] & ba) && db[p] & bb) {
              db[p] &= ~bb;
              changed = true;
            }
            if (!(db[p] & bb) && da[p] & ba) {
              da[p] &= ~ba;
              changed = true;
            }
            if (da[p] === ba && db[p] !== bb) {
              db[p] = bb;
              changed = true;
            }
            if (db[p] === bb && da[p] !== ba) {
              da[p] = ba;
              changed = true;
            }
            if (!da[p] || !db[p]) return false;
          }
        } else if (cl.kind === "next") {
          for (let p = 0; p < N; p++) {
            if (!(da[p] & ba)) {
              if (p + 1 < N && db[p + 1] & bb) {
                db[p + 1] &= ~bb;
                changed = true;
              }
            }
            if (p + 1 < N && !(db[p + 1] & bb)) {
              if (da[p] & ba) {
                da[p] &= ~ba;
                changed = true;
              }
            }
            if (da[p] === ba) {
              if (p + 1 >= N) return false;
              if (db[p + 1] !== bb) {
                db[p + 1] = bb;
                changed = true;
              }
            }
            if (p + 1 < N && db[p + 1] === bb && da[p] !== ba) {
              da[p] = ba;
              changed = true;
            }
            if (!da[p] || (p + 1 < N && !db[p + 1])) return false;
          }
        } else if (cl.kind === "left") {
          for (let p = 0; p < N; p++) {
            if (da[p] === ba) {
              for (let q = 0; q <= p; q++)
                if (db[q] & bb) {
                  db[q] &= ~bb;
                  changed = true;
                  if (!db[q]) return false;
                }
            }
            if (db[p] === bb) {
              for (let q = p; q < N; q++)
                if (da[q] & ba) {
                  da[q] &= ~ba;
                  changed = true;
                  if (!da[q]) return false;
                }
            }
          }
        }
      }
    }
    return true;
  }

  function countSolutions(nc, clues, limit) {
    const dom = [];
    for (let c = 0; c < nc; c++) dom.push(new Array(N).fill(FULL));
    /* pos 线索先落地 */
    for (const cl of clues)
      if (cl.kind === "pos") {
        dom[cl.a][cl.p] = 1 << cl.va;
      }
    if (!propagate(dom, clues, nc)) return 0;

    let count = 0;
    function dfs(d) {
      let bestC = -1,
        bestP = -1,
        bestCnt = 99;
      for (let c = 0; c < nc; c++)
        for (let p = 0; p < N; p++) {
          const k = popcount(d[c][p]);
          if (!k) return;
          if (k > 1 && k < bestCnt) {
            bestCnt = k;
            bestC = c;
            bestP = p;
          }
        }
      if (bestC < 0) {
        count++;
        return;
      }
      const row = d[bestC];
      for (let v = 0; v < N; v++) {
        if (!((row[bestP] >> v) & 1)) continue;
        const nd = d.map((r) => r.slice());
        nd[bestC][bestP] = 1 << v;
        if (!propagate(nd, clues, nc)) continue;
        dfs(nd);
        if (count >= limit) return;
      }
    }
    dfs(dom);
    return count;
  }

  /* ---------- 中文渲染 ---------- */
  function fill(tpl, v) {
    return tpl.replace("{v}", v);
  }

  function posText(p) {
    const fromStart = p + 1,
      fromEnd = N - p;
    return fromEnd < fromStart
      ? `倒数第${fromEnd}个位置`
      : `第${fromStart}个位置`;
  }

  function clueText(cl, ctx) {
    const { cats, valOf, themeKey } = ctx;
    const ph = PHRASE[themeKey];
    const noun = (ci, vi) => fill(ph[cats[ci]].noun, valOf(ci, vi));
    const pred = (ci, vi) => fill(ph[cats[ci]].pred, valOf(ci, vi));
    const answerCat = cats[0];
    if (cl.kind === "pos") return `${noun(cl.a, cl.va)}在${posText(cl.p)}。`;
    if (cl.kind === "same") {
      const A = cats[cl.a],
        B = cats[cl.b];
      if (isRoomish(themeKey, A)) {
        if (B === answerCat)
          return `${noun(cl.a, cl.va)}里的人就是${valOf(cl.b, cl.vb)}。`;
        if (isRoomish(themeKey, B))
          return `${noun(cl.a, cl.va)}就是${noun(cl.b, cl.vb)}。`;
        return `${noun(cl.a, cl.va)}里的人${pred(cl.b, cl.vb)}。`;
      }
      if (isRoomish(themeKey, B))
        return `${noun(cl.a, cl.va)}在${noun(cl.b, cl.vb)}里。`;
      if (B === answerCat)
        return `${noun(cl.a, cl.va)}就是${valOf(cl.b, cl.vb)}。`;
      if (A === answerCat) return `${valOf(cl.a, cl.va)}${pred(cl.b, cl.vb)}。`;
      return `${noun(cl.a, cl.va)}${pred(cl.b, cl.vb)}。`;
    }
    if (cl.kind === "next")
      return `${noun(cl.a, cl.va)}的右边紧挨着${noun(cl.b, cl.vb)}。`;
    return `${noun(cl.a, cl.va)}在${noun(cl.b, cl.vb)}的左边（不一定相邻）。`;
  }

  function rawOf(cl, ctx) {
    const { cats, valOf } = ctx;
    if (cl.kind === "pos")
      return ["pos", cats[cl.a], valOf(cl.a, cl.va), cl.p + 1];
    return [
      cl.kind,
      cats[cl.a],
      valOf(cl.a, cl.va),
      cats[cl.b],
      valOf(cl.b, cl.vb),
    ];
  }

  /* ---------- 生成一道题 ---------- */
  function make(themeKey, diff, seed) {
    const rnd = mulberry32(seed >>> 0);
    const meta = META[themeKey];
    const allCats = Object.keys(meta.cats);
    const answerCat = allCats[0];
    const cats = [answerCat, ...shuffle(allCats.slice(1), rnd).slice(0, 3)];
    const nc = cats.length;

    /* 随机解：每类属性一个排列 */
    const sol = {};
    cats.forEach((c) => (sol[c] = shuffle([0, 1, 2, 3, 4], rnd)));
    const posOf = {};
    cats.forEach((c) => {
      posOf[c] = [];
      sol[c].forEach((v, p) => (posOf[c][v] = p));
    });

    /* 候选线索池：全部在该解下为真 */
    const pool = [];
    const posValues = shuffle([0, 1, 2, 3, 4], rnd).slice(0, 3);
    for (const v of posValues)
      pool.push({ kind: "pos", a: 0, va: v, p: posOf[answerCat][v] });
    for (let i = 0; i < nc; i++)
      for (let j = i + 1; j < nc; j++) {
        if (AVOID.has(pairKey(cats[i], cats[j]))) continue;
        for (let va = 0; va < N; va++)
          for (let vb = 0; vb < N; vb++)
            if (posOf[cats[i]][va] === posOf[cats[j]][vb]) {
              if (gramClash(meta.cats[cats[i]][va], meta.cats[cats[j]][vb]))
                continue;
              pool.push({ kind: "same", a: i, va, b: j, vb });
            }
      }
    const nx = [],
      lf = [];
    for (let i = 0; i < nc; i++)
      for (let j = 0; j < nc; j++) {
        if (i === j) continue;
        for (let va = 0; va < N; va++)
          for (let vb = 0; vb < N; vb++) {
            const d = posOf[cats[j]][vb] - posOf[cats[i]][va];
            if (d === 1) nx.push({ kind: "next", a: i, va, b: j, vb });
            else if (d > 1) lf.push({ kind: "left", a: i, va, b: j, vb });
          }
      }
    pool.push(...shuffle(nx, rnd).slice(0, 24));
    pool.push(...shuffle(lf, rnd).slice(0, 30));

    /* 同一句话只留一条，避免题面出现重复线索 */
    const ctx = {
      cats,
      sol,
      themeKey,
      /* vi 是“取值序号”，直接查名字表；sol 只负责“位置→取值序号” */
      valOf: (ci, vi) => meta.cats[cats[ci]][vi],
    };
    const seenText = new Set();
    const poolUniq = pool.filter((cl) => {
      const t = clueText(cl, ctx);
      if (seenText.has(t)) return false;
      seenText.add(t);
      return true;
    });
    pool.length = 0;
    pool.push(...poolUniq);

    /* 先确认整池线索足以定解；不够就把剩下的位置线索补回来 */
    let keep = pool.map((_, i) => i);
    if (countSolutions(nc, pool, 2) !== 1) {
      for (let v = 0; v < N; v++) {
        if (posValues.includes(v)) continue;
        pool.push({ kind: "pos", a: 0, va: v, p: posOf[answerCat][v] });
        if (countSolutions(nc, pool, 2) === 1) break;
      }
      keep = pool.map((_, i) => i);
    }

    /* 逐条剔除冗余线索：删掉后仍唯一，就永久删掉 */
    for (const idx of shuffle(keep, rnd)) {
      if (keep.length <= 4) break;
      const trial = keep.filter((i) => i !== idx);
      if (
        countSolutions(
          nc,
          trial.map((i) => pool[i]),
          2,
        ) === 1
      )
        keep = trial;
    }

    /* 按难度补回线索：简单多给、困难只给最小集 */
    const spareRank = { same: 0, next: 1, left: 2, pos: 3 };
    const spare = shuffle(
      pool.filter((_, i) => !keep.includes(i)),
      rnd,
    ).sort((x, y) => spareRank[x.kind] - spareRank[y.kind]);
    const extra =
      diff === "easy" ? 5 : diff === "normal" ? 3 : diff === "medium" ? 1 : 0;
    const chosen = keep.map((i) => pool[i]).concat(spare.slice(0, extra));

    /* 排序：位置 → 同格 → 相邻 → 左右，读起来顺一点 */
    chosen.sort((x, y) => rank(x.kind) - rank(y.kind));

    const question = (() => {
      const qi = 1 + Math.floor(rnd() * (nc - 1));
      const p = Math.floor(rnd() * N);
      const cat = cats[qi],
        val = meta.cats[cat][sol[cat][p]];
      return {
        q: fill(PHRASE[themeKey][cat].q, val),
        a: { position: p + 1, value: meta.cats[answerCat][sol[answerCat][p]] },
      };
    })();

    const categories = {};
    cats.forEach((c) => (categories[c] = meta.cats[c].slice()));

    return {
      id: `gen-${themeKey}-${diff}-${(seed >>> 0).toString(36)}`,
      theme_key: themeKey,
      theme: meta.title,
      intro: meta.intro,
      difficulty: diff,
      categories,
      clue_count: chosen.length,
      clues: chosen.map((cl) => clueText(cl, ctx)),
      rawClues: chosen.map((cl) => rawOf(cl, ctx)),
      question: question.q,
      answer: question.a,
      solution: Object.fromEntries(
        cats.map((c) => [c, sol[c].map((v) => meta.cats[c][v])]),
      ),
    };
  }

  function rank(kind) {
    return { pos: 0, same: 1, next: 2, left: 3 }[kind] ?? 9;
  }

  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  /* 每日题：由日期派生种子，任何设备打开都是同一道 */
  function daily(dateKey) {
    const seed = hashSeed("zebra-daily-" + dateKey);
    const themes = Object.keys(META);
    const diffs = ["easy", "normal", "hard"];
    const themeKey = themes[seed % themes.length];
    const diff = diffs[(seed >>> 5) % diffs.length];
    const p = make(themeKey, diff, seed);
    p.id = "gen-daily-" + dateKey;
    return { ...p, date: dateKey };
  }

  return { make, daily, countSolutions, hashSeed, themes: () => Object.keys(PHRASE) };
})();

/* 轻量 DOM 工具，避免各模块重复拼节点 */
const $ = (id) => document.getElementById(id);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function button(text, onClick, className = "btn") {
  const node = el("button", className, text);
  node.onclick = onClick;
  return node;
}

/* 统一消息区的文字与状态样式："" | "ok" | "no" */
function setMessage(id, text, kind = "") {
  const node = $(id);
  node.textContent = text;
  node.className = "msg" + (kind ? " " + kind : "");
}

function toggleHidden(id, hidden) {
  $(id).classList.toggle("hidden", hidden);
}

function formatClock(sec) {
  sec = Math.round(sec);
  const m = Math.floor(sec / 60),
    s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/* 本地档案：读取校验、保存、统计与历史 */
const EMPTY_RECORD = () => ({ solved: {}, history: [], done: [] });

function loadRec() {
  try {
    const raw = localStorage.getItem("zebra_records");
    if (raw) {
      const data = JSON.parse(raw);
      if (data && typeof data === "object" && !Array.isArray(data)) {
        const records = EMPTY_RECORD();
        for (const key of ["done", "wins", "daily"])
          records[key] = Array.isArray(data[key])
            ? data[key].filter((x) => typeof x === "string")
            : [];
        records.story = Array.isArray(data.story)
          ? data.story.filter((x) => Number.isInteger(x) && x >= 0)
          : [];
        records.history = Array.isArray(data.history)
          ? data.history.filter((x) => x && typeof x === "object").slice(0, 60)
          : [];
        for (const key of Object.keys(DIFF_NAMES)) {
          const stat = data.solved?.[key];
          if (
            stat &&
            Number.isInteger(stat.n) &&
            stat.n >= 0 &&
            Number.isFinite(stat.total) &&
            stat.total >= 0 &&
            (stat.best === null ||
              (Number.isFinite(stat.best) && stat.best >= 0))
          )
            records.solved[key] = {
              n: stat.n,
              best: stat.best,
              total: stat.total,
            };
        }
        return records;
      }
    }
  } catch (e) {}
  return EMPTY_RECORD();
}

function saveRec(r) {
  localStorage.setItem("zebra_records", JSON.stringify(r));
}

function resetRecords() {
  REC = EMPTY_RECORD();
  saveRec(REC);
  renderStats();
}

let REC = loadRec();

const fmt = formatClock;

/* 记录一次作答。同一题只记一次，看答案也计入“已做”。 */
function record(sec, ok) {
  if (S.recorded) return;
  S.recorded = true;
  REC.story = REC.story || [];
  REC.daily = REC.daily || [];
  if (
    ok &&
    S.mode === "story" &&
    CHAPTERS[S.chapter].stages.length === 1 &&
    !REC.story.includes(S.chapter)
  )
    REC.story.push(S.chapter);
  if (ok && S.mode === "daily" && !REC.daily.includes(S.day))
    REC.daily.push(S.day);
  if (ok && S.mode === "story") showStoryResult();

  const p = S.cur;
  const d = p.difficulty;
  if (!REC.solved[d]) REC.solved[d] = { n: 0, best: null, total: 0 };
  const generated = String(p.id).startsWith("gen-");
  if (ok && (generated || !(REC.wins || []).includes(p.id))) {
    REC.wins = REC.wins || [];
    if (!generated) REC.wins.push(p.id);
    const s = REC.solved[d];
    s.n++;
    s.total += sec;
    s.best = s.best == null ? sec : Math.min(s.best, sec);
  }
  if (!generated && !REC.done.includes(p.id)) REC.done.push(p.id);
  const now = new Date();
  REC.history.unshift({
    time: `${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`,
    theme: p.theme_key,
    diff: d,
    sec: Math.round(sec),
    ok,
    mode: S.mode,
  });
  REC.history = REC.history.slice(0, 60);
  saveRec(REC);
  renderStats();
}

/* 档案面板：各难度统计与最近记录 */
function renderStats() {
  renderModes();
  const box = $("statBox");
  box.replaceChildren();
  ["easy", "normal", "hard"].forEach((d) => {
    const s = REC.solved[d] || { n: 0, best: null, total: 0 };
    const avg = s.n ? fmt(s.total / s.n) : "—";
    const item = el("div", "stat");
    const count = el("b", null, `${s.n} 题`);
    const detail = el(
      "span",
      null,
      `${DIFF_NAMES[d]} · 最快 ${s.best == null ? "—" : fmt(s.best)} · 平均 ${avg}`,
    );
    item.append(count, detail);
    box.appendChild(item);
  });

  const h = $("histBox");
  h.style.whiteSpace = "pre-line";
  if (!REC.history.length) {
    h.textContent = "还没有记录。做一题，这里就会留下痕迹。";
    return;
  }
  h.textContent = REC.history
    .filter((x) => x && typeof x === "object")
    .slice(0, 12)
    .map(
      (x) =>
        `· ${x.time}　${THEME_NAMES[x.theme] || x.theme} / ${DIFF_NAMES[x.diff] || x.diff}　${x.ok ? "完成" : "查看答案"} · 用时 ${fmt(x.sec)}`,
    )
    .join("\n");
}

/* Evaluate only the player's entries, never the stored solution.
 * Unplaced values can occupy any blank cell in their category.
 * Mark fulfilled only when the referenced values have actually been placed.
 */
function clueState(clue, assignments) {
  const [kind, c1, v1, c2, v2, gap] = clue;
  const rowOf = (c) => assignments[c] || [];
  const positions = (c, v) => {
    const row = rowOf(c);
    const i = row.indexOf(v);
    return i >= 0 ? [i + 1] : row.flatMap((x, j) => (x ? [] : [j + 1]));
  };
  const placed = (c, v) => rowOf(c).includes(v);

  if (kind === "pos") {
    if (!positions(c1, v1).includes(c2)) return "conflict";
    return placed(c1, v1) ? "satisfied" : "pending";
  }
  if (kind === "not") {
    if (placed(c1, v1)) return rowOf(c1).indexOf(v1) + 1 === c2 ? "conflict" : "satisfied";
    return positions(c1, v1).some((x) => x !== c2) ? "pending" : "conflict";
  }

  const relation = {
    same: (a, b) => a === b,
    next: (a, b) => b === a + 1,
    nextleft: (a, b) => b === a + 1,
    side: (a, b) => Math.abs(a - b) === 1,
    left: (a, b) => a < b,
    right: (a, b) => a > b,
    between: (a, b) => Math.abs(a - b) === gap + 1,
  }[kind];
  if (!relation) return "pending";

  const possible = positions(c1, v1).some((a) =>
    positions(c2, v2).some(
      (b) => !(c1 === c2 && v1 !== v2 && a === b) && relation(a, b),
    ),
  );
  if (!possible) return "conflict";
  return placed(c1, v1) && placed(c2, v2) ? "satisfied" : "pending";
}

function renderClues() {
  const list = document.getElementById("clues");
  list.replaceChildren();
  S.cur.clues.forEach((text) => {
    const item = document.createElement("li");
    const status = document.createElement("span");
    status.className = "clue-status";
    const label = document.createElement("span");
    label.className = "clue-text";
    label.textContent = text;
    item.append(status, label);
    list.appendChild(item);
  });
  list.parentElement.scrollTop = 0;
}

function updateClues() {
  if (!S.cur) return;
  const labels = {
    pending: "待确定",
    satisfied: "已满足",
    conflict: "与当前填表冲突",
  };
  const symbols = { pending: "□", satisfied: "✓", conflict: "✕" };
  let satisfied = 0;
  document.querySelectorAll("#clues li").forEach((item, i) => {
    const state = clueState(S.cur.rawClues[i], S.assign);
    item.className = state;
    item.dataset.state = state;
    if (state === "satisfied") satisfied++;
    const status = item.querySelector(".clue-status");
    status.textContent = symbols[state];
    status.setAttribute("aria-label", labels[state]);
    item.title = labels[state];
  });
  updateClueProgress(satisfied);
}

/* 顶部进度条：已满足的线索 / 全部线索 */
function updateClueProgress(satisfied) {
  const total = (S.cur?.rawClues || []).length;
  const label = $("clueProgress");
  if (label) label.textContent = satisfied + "/" + total;
  const bar = $("clueBar");
  if (bar) bar.style.width = (total ? (satisfied / total) * 100 : 0) + "%";
}

/* 故事模式：通关档案、下一阶段入口 */
function renderStoryArchive(fragments, ending) {
  const box = $("storyBox");
  if (!box) return;
  box.replaceChildren();
  box.classList.remove("hidden");
  if (fragments.length) {
    box.appendChild(el("div", "label", "案件档案 · 逐层揭开"));
    fragments.forEach((f) => {
      const item = el("p", "frag");
      item.append(
        el("b", null, f.title + "　"),
        document.createTextNode(f.text),
      );
      box.appendChild(item);
    });
  }
  if (ending) {
    box.appendChild(el("div", "label", "收尾小剧场"));
    box.appendChild(el("p", "ending", ending));
  }
  if (box.scrollIntoView)
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* 追问的选项：正确答案加三个同类干扰项，顺序按题号固定 */
function questionOptions(p) {
  const val = p.answer && p.answer.value;
  if (!val) return [];
  const cat = Object.keys(p.categories).find((c) =>
    p.categories[c].includes(val),
  );
  if (!cat) return [];
  const others = p.categories[cat].filter((v) => v !== val);
  if (!others.length) return [];
  let seed = 0;
  String(p.id)
    .split("")
    .forEach((ch) => {
      seed = (seed * 31 + ch.charCodeAt(0)) % 100003;
    });
  const pool = others.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    const j = seed % (i + 1);
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const options = [val, ...pool.slice(0, 3)];
  for (let i = options.length - 1; i > 0; i--) {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    const j = seed % (i + 1);
    [options[i], options[j]] = [options[j], options[i]];
  }
  return options;
}

/* 追问：通关后由玩家自己选，选对了才把这一层的剧情放出来 */
function renderQuestionGate(reveal) {
  const box = $("storyBox");
  const p = S.cur;
  const options = questionOptions(p);
  if (!options.length || !p.question) {
    reveal();
    return;
  }
  box.replaceChildren();
  box.classList.remove("hidden");
  const card = el("div", "ask");
  card.appendChild(el("div", "label", "追问"));
  card.appendChild(el("p", "ask-text", p.question));
  const row = el("div", "ask-row");
  const note = el("p", "ask-note", "选一个名字，看看当年到底是谁。");
  let wrong = 0;
  options.forEach((v) => {
    const b = button(v, () => {
      if (b.disabled) return;
      if (v === p.answer.value) {
        card.querySelectorAll("button").forEach((x) => {
          x.disabled = true;
        });
        note.textContent = "答对了。";
        note.className = "ask-note ok";
        setTimeout(reveal, 320);
        return;
      }
      wrong += 1;
      b.disabled = true;
      b.classList.add("wrong");
      if (wrong >= 3) {
        card.querySelectorAll("button").forEach((x) => {
          x.disabled = true;
        });
        note.textContent = `三个都没猜中，答案是「${p.answer.value}」。`;
        setTimeout(reveal, 900);
        return;
      }
      note.textContent = "不是这个，再想想。";
      note.className = "ask-note bad";
    });
    b.className = "btn ask-opt";
    b.type = "button";
    row.appendChild(b);
  });
  card.appendChild(row);
  card.appendChild(note);
  box.appendChild(card);
}

/* 通关当前阶段后，展示剧情并允许继续下一阶段 */
function showStoryResult() {
  const ch = CHAPTERS[S.chapter];
  if (!ch) return;
  const stageData = ch.stages[S.stage];
  const p = S.cur;
  const ending = (p.ending || stageData.ending || "").trim();
  const reveal = () => {
    renderStoryArchive(p.fragments || [], ending);
    addNextStage();
  };
  if (S.solved) {
    renderQuestionGate(reveal);
    return;
  }
  reveal();
}

/* 有下一阶段时补一个入口 */
function addNextStage() {
  const ch = CHAPTERS[S.chapter];
  if (!ch) return;
  if (S.stage + 1 >= ch.stages.length) return;
  if (S.stage + 1 >= ch.stages.length) return;
  const next = button(
    "继续下一阶段 →",
    () => {
      chapter = S.chapter;
      stage = S.stage + 1;
      mode = "story";
      startGame();
    },
    "btn primary",
  );
  next.id = "nextStageBtn";
  $("storyBox").appendChild(next);
}

/* 开局：选题、初始化状态、计时 */
function pickPuzzle() {
  if (mode === "story") {
    const ch = CHAPTERS[chapter]?.stages[stage];
    if (!ch || (stage > 0 && !stageDone(CHAPTERS[chapter], stage - 1)))
      return null;
    const title = CHAPTERS[chapter].title + " · " + ch.title;
    if (ch.src) {
      const p = hydrate(
        PUZ[ch.src.theme + "_" + ch.src.diff][ch.src.index],
        ch.src.theme,
        ch.src.diff,
      );
      return { ...p, theme: title };
    }
    return hydrateStory({ ...ch, title }, chapter);
  }
  if (mode === "daily") {
    const item = BANK.daily.find((p) => p.date === dayKey());
    return item
      ? { ...hydrate(item, item.theme, item.diff), date: item.date }
      : GEN.daily(dayKey());
  }
  /* 自由模式：现场生成一道新题，保证线索精简、解唯一、措辞通顺 */
  const genThemes = GEN.themes();
  const bankOnly =
    (S.theme !== "all" && !genThemes.includes(S.theme)) ||
    (S.diff !== "all" && !["easy", "normal", "hard"].includes(S.diff));
  if (bankOnly) return pickFromBank();
  const themes = S.theme === "all" ? genThemes : [S.theme];
  const diffs = S.diff === "all" ? ["easy", "normal", "hard"] : [S.diff];
  const themeKey = themes[Math.floor(Math.random() * themes.length)];
  const diff = diffs[Math.floor(Math.random() * diffs.length)];
  return GEN.make(themeKey, diff, Math.floor(Math.random() * 4294967296));
}

/* 六列题与加强题是预先算好的，直接按筛选条件从题库里抽未做的 */
function pickFromBank() {
  const all = filteredPuzzles();
  const undone = all.filter((p) => !REC.done.includes(p.id));
  const pool = undone.length ? undone : all;
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function startGame(selected) {
  const p = selected && selected.id ? selected : pickPuzzle();
  if (!p) {
    $("homeMsg").textContent =
      mode === "daily"
        ? "今日题目尚未发布，请稍后刷新；可以先做历史每日题。"
        : "当前筛选下没有未做题了；请放宽条件，或从题目列表选择重玩。";
    return;
  }
  setMessage("homeMsg", "");
  S.cur = p;
  S.mode = mode;
  S.chapter = chapter;
  S.stage = stage;
  S.day = p.date || dayKey();
  S.recorded = false;
  S.undoStack = [];
  S.hinted = {};
  S.focus = null;
  S.assign = {};
  S.n = p.categories[Object.keys(p.categories)[0]].length;
  Object.keys(p.categories).forEach(
    (c) => (S.assign[c] = new Array(S.n).fill(null)),
  );
  S.solved = false;

  const storyBox = $("storyBox");
  storyBox.classList.add("hidden");
  storyBox.replaceChildren();
  toggleHidden("home", true);
  toggleHidden("game", false);
  $("gameTitle").textContent = puzzleTitle(p);
  $("intro").textContent = puzzleIntro(p);
  setMessage("gameMsg", "");
  $("checkBtn").disabled = false;
  $("giveUpBtn").disabled = false;
  $("hintBtn").disabled = false;

  renderClues();
  renderGrid();
  startTimer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function puzzleTitle(p) {
  const theme =
    S.mode === "story" ? p.theme : THEME_NAMES[p.theme_key] || p.theme;
  return `${theme} · ${DIFF_NAMES[p.difficulty] || p.difficulty} · ${p.clue_count} 条线索`;
}

function puzzleIntro(p) {
  if (S.mode === "story") {
    const ch = CHAPTERS[S.chapter];
    const stageIntro = ch.stages[S.stage].intro;
    return p.intro + (stageIntro ? " " + stageIntro : "");
  }
  if (S.mode === "daily") return S.day + " 每日挑战（北京时间）。 " + p.intro;
  return p.intro;
}

function startTimer() {
  clearInterval(S.timerId);
  S.t0 = Date.now();
  S.elapsed = 0;
  $("timer").textContent = "00:00";
  S.timerId = setInterval(() => {
    S.elapsed = (Date.now() - S.t0) / 1000;
    $("timer").textContent = fmt(S.elapsed);
  }, 250);
}

function stopTimer() {
  clearInterval(S.timerId);
  S.timerId = null;
}

function backHome() {
  stopTimer();
  toggleHidden("game", true);
  toggleHidden("home", false);
  renderStats();
}

/* 棋盘：点击填格、取值面板、撤回/重置、随填随查、看答案 */

/* 每格显示的是“值”，空格显示一个淡淡的圆点；点击弹出取值面板 */
function renderGrid() {
  updateClues();
  updateEditButtons();
  const p = S.cur,
    tb = $("grid");
  tb.replaceChildren();
  tb.classList.toggle("dense", S.n >= 6);

  const head = document.createElement("tr");
  head.appendChild(el("th", "corner", ""));
  for (let i = 1; i <= S.n; i++) {
    const th = el("th", "colh");
    th.appendChild(el("span", "colnum", String(i)));
    th.appendChild(
      el(
        "span",
        "collabel",
        p.colLabels ? p.colLabels[i - 1] : "第" + i + "位",
      ),
    );
    head.appendChild(th);
  }
  tb.appendChild(head);

  Object.keys(p.categories).forEach((cat) => {
    const tr = document.createElement("tr");
    tr.appendChild(el("th", "rowh", cat));
    for (let i = 0; i < S.n; i++) {
      const td = document.createElement("td");
      td.appendChild(cellButton(p, cat, i));
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
}

function cellButton(p, cat, i) {
  const v = S.assign[cat][i];
  const b = el("button", "cell" + (v ? " filled" : "") + (v ? "" : " empty"));
  b.dataset.cat = cat;
  b.dataset.idx = i;
  b.type = "button";
  b.setAttribute(
    "aria-label",
    cat + "，第" + (i + 1) + "位" + (v ? "：" + v : "：空"),
  );
  b.textContent = v || "·";
  if (S.hinted?.[cat]?.[i]) b.classList.add("hinted");
  b.disabled = S.solved;
  if (S.focus && S.focus.cat === cat && S.focus.idx === i)
    b.classList.add("focus");
  b.onclick = (ev) => {
    ev.stopPropagation();
    S.focus = { cat, idx: i };
    openPicker(cat, i, b);
  };
  return b;
}

/* ---------- 取值面板 ---------- */
function pickerNode() {
  let box = $("cellPicker");
  if (box) return box;
  box = el("div", "picker");
  box.id = "cellPicker";
  box.hidden = true;
  box.innerHTML =
    '<div class="picker-box" role="dialog" aria-label="选择这一格的内容">' +
    '<div class="picker-head"><span id="pickerTitle"></span>' +
    '<button type="button" class="picker-x" id="pickerClose" aria-label="关闭">×</button></div>' +
    '<div class="picker-opts" id="pickerOpts"></div></div>';
  document.body.appendChild(box);
  box.addEventListener("click", (ev) => {
    if (ev.target === box) closePicker();
  });
  return box;
}

function openPicker(cat, idx, anchor) {
  if (S.solved) return;
  const p = S.cur,
    box = pickerNode(),
    opts = $("pickerOpts");
  $("pickerTitle").textContent = cat + " · 第 " + (idx + 1) + " 位";
  opts.replaceChildren();

  p.categories[cat].forEach((value) => {
    const usedAt = S.assign[cat].indexOf(value);
    const b = el(
      "button",
      "opt" +
        (S.assign[cat][idx] === value ? " on" : "") +
        (usedAt >= 0 && usedAt !== idx ? " used" : ""),
    );
    b.type = "button";
    b.appendChild(el("span", "opt-t", value));
    if (usedAt >= 0 && usedAt !== idx)
      b.appendChild(el("span", "opt-note", "已在第 " + (usedAt + 1) + " 位"));
    b.onclick = () => {
      setCell(cat, idx, value);
      closePicker();
    };
    opts.appendChild(b);
  });

  const clear = el("button", "opt clear", "清空这一格");
  clear.type = "button";
  clear.onclick = () => {
    setCell(cat, idx, null);
    closePicker();
  };
  opts.appendChild(clear);

  box.hidden = false;
  positionPicker(box, anchor);
  $("pickerClose").onclick = closePicker;
  renderGrid();
}

/* 面板贴着被点的那一格，靠近边缘时自动收进视口 */
function positionPicker(box, anchor) {
  const rect = anchor?.getBoundingClientRect?.();
  box.style.left = "50%";
  box.style.top = "50%";
  box.style.transform = "translate(-50%,-50%)";
  if (!rect || (!rect.width && !rect.height)) return;
  const panel = box.querySelector(".picker-box");
  const w = panel.offsetWidth || 260,
    h = panel.offsetHeight || 240;
  const gap = 8;
  let left = rect.left + rect.width / 2 - w / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - w - 10));
  let top = rect.bottom + gap;
  if (top + h > window.innerHeight - 10) top = Math.max(10, rect.top - h - gap);
  box.style.transform = "none";
  box.style.left = left + "px";
  box.style.top = top + "px";
}

function closePicker() {
  const box = $("cellPicker");
  if (box) box.hidden = true;
}

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") closePicker();
});

/* ---------- 填表 ---------- */
function setCell(cat, idx, v) {
  if (S.solved || S.assign[cat][idx] === v) return;
  S.undoStack.push(copyAssignments());
  clearEditMessage();
  // 同一类别里同一个值只能出现一次，若重复则把原来那格让出来
  if (v) {
    const old = S.assign[cat].indexOf(v);
    if (old >= 0 && old !== idx) S.assign[cat][old] = null;
  }
  S.assign[cat][idx] = v;
  renderGrid();
  autoCheck();
}

/* 整表快照：移动重复值造成的原格清空也作为一步撤回 */
function copyAssignments() {
  return Object.fromEntries(
    Object.entries(S.assign).map(([cat, row]) => [cat, row.slice()]),
  );
}

function clearEditMessage() {
  setMessage("gameMsg", "");
}

function updateEditButtons() {
  $("undoBtn").disabled = S.solved || !S.undoStack?.length;
  $("resetBtn").disabled =
    S.solved || !Object.values(S.assign).some((row) => row.some(Boolean));
}

function undoMove() {
  if (S.solved || !S.undoStack.length) return;
  S.assign = S.undoStack.pop();
  closePicker();
  clearEditMessage();
  renderGrid();
}

function resetBoard() {
  if (S.solved || !Object.values(S.assign).some((row) => row.some(Boolean)))
    return;
  if (
    !confirm(
      "确定清空本题的所有填写吗？计时继续，已保存的档案不受影响；清空后可以撤回。",
    )
  )
    return;
  S.undoStack.push(copyAssignments());
  Object.keys(S.assign).forEach((cat) => S.assign[cat].fill(null));
  S.hinted = {};
  clearEditMessage();
  closePicker();
  renderGrid();
}

/* 只统计玩家填表：空格数与冲突线索数，不提前泄露答案 */
function inspectBoard() {
  let blanks = 0,
    conflicts = 0;
  Object.values(S.assign).forEach((row) =>
    row.forEach((v) => {
      if (!v) blanks++;
    }),
  );
  (S.cur.rawClues || []).forEach((clue) => {
    if (clueState(clue, S.assign) === "conflict") conflicts++;
  });
  return { blanks, conflicts };
}

/* 全表填满且没有冲突时，自动判定完成 */
function autoCheck() {
  if (S.solved) return;
  const { blanks, conflicts } = inspectBoard();
  if (blanks) return;
  if (conflicts) {
    setMessage(
      "gameMsg",
      `有 ${conflicts} 条线索和当前填表冲突，回到线索里再推一推。`,
      "no",
    );
    return;
  }
  finishBoard(true);
}

function check() {
  if (S.solved) return;
  const { blanks, conflicts } = inspectBoard();
  if (blanks)
    return setMessage("gameMsg", `还有 ${blanks} 格没填。慢慢来，不急。`, "no");
  if (conflicts)
    return setMessage(
      "gameMsg",
      `有 ${conflicts} 条线索和当前填表冲突。线索是够用的，再推一推。`,
      "no",
    );
  setMessage("gameMsg", "所有线索都对上了。", "ok");
}

/* 提示：替你把最有把握的一格填上，计一次提示 */
function hintCell() {
  if (S.solved) return;
  const p = S.cur;
  const blanks = [];
  Object.keys(p.categories).forEach((cat) => {
    p.categories[cat].forEach((_, i) => {
      if (!S.assign[cat][i]) blanks.push({ cat, i });
    });
  });
  if (!blanks.length) return;
  const pick = blanks[Math.floor(Math.random() * blanks.length)];
  S.undoStack.push(copyAssignments());
  const v = p.solution[pick.cat][pick.i];
  const old = S.assign[pick.cat].indexOf(v);
  if (old >= 0) S.assign[pick.cat][old] = null;
  S.assign[pick.cat][pick.i] = v;
  S.hinted = S.hinted || {};
  S.hinted[pick.cat] = S.hinted[pick.cat] || [];
  S.hinted[pick.cat][pick.i] = true;
  setMessage("gameMsg", `提示：${pick.cat} 的第 ${pick.i + 1} 位是「${v}」。`);
  renderGrid();
  autoCheck();
}

function giveUp() {
  if (S.solved) return;
  if (
    !confirm("确定查看答案吗？本题将标记为已做，本次不计通关，也不会解锁成就。")
  )
    return;
  const p = S.cur;
  Object.keys(p.categories).forEach((cat) => {
    S.assign[cat] = p.solution[cat].slice();
  });
  finishBoard(false);
}

/* 结束本题：锁定棋盘、停表、显示结果并写入档案 */
function finishBoard(ok) {
  S.solved = true;
  stopTimer();
  closePicker();
  updateEditButtons();
  renderGrid();
  document.querySelectorAll(".cell").forEach((b) => {
    b.classList.add("right");
    b.disabled = true;
  });
  $("checkBtn").disabled = true;
  $("giveUpBtn").disabled = true;
  $("hintBtn").disabled = true;
  if (ok && S.mode === "story")
    setMessage("gameMsg", `全对！用时 ${fmt(S.elapsed)}。`, "ok");
  else if (ok)
    setMessage(
      "gameMsg",
      `全对！用时 ${fmt(S.elapsed)}。答案是「${S.cur.answer.value}」。`,
      "ok",
    );
  else setMessage("gameMsg", `答案是：${S.cur.answer.value}。`);
  record(S.elapsed, ok);
}

/* 自由推理：主题/难度筛选与题目列表 */

/* 某个主题+难度组合里，题库还剩几道没做 */
function bankStats(theme, diff) {
  let total = 0,
    undone = 0;
  for (const [key, items] of Object.entries(PUZ)) {
    const [t, d] = key.split("_");
    if (theme !== "all" && t !== theme) continue;
    if (diff !== "all" && d !== diff) continue;
    items.forEach((p) => {
      total++;
      if (!REC.done.includes(p.id)) undone++;
    });
  }
  return { total, undone };
}

/* 这个组合还能不能出题：生成器能现场造，或者题库里还有没做的 */
function canPlay(theme, diff) {
  const genOk =
    (theme === "all" || GEN.themes().includes(theme)) &&
    (diff === "all" || ["easy", "normal", "hard"].includes(diff));
  return genOk || bankStats(theme, diff).undone > 0;
}

/* 这个组合下到底有没有题（不管做没做），用来防止选项悬空 */
function hasAnyPuzzle(theme, diff) {
  const genOk =
    (theme === "all" || GEN.themes().includes(theme)) &&
    (diff === "all" || ["easy", "normal", "hard"].includes(diff));
  return genOk || bankStats(theme, diff).total > 0;
}

/* 没得做就把按钮变灰，别让人点了才发现 */
function updateStartState() {
  const btn = $("startBtn");
  if (!btn) return;
  const ok = mode !== "free" || canPlay(S.theme, S.diff);
  btn.disabled = !ok;
  btn.classList.toggle("off", !ok);
  const listBtn = $("listBtn");
  if (listBtn) {
    const empty = mode === "free" && bankStats(S.theme, S.diff).total === 0;
    listBtn.disabled = empty;
    listBtn.classList.toggle("off", empty);
  }
  if (!ok) setMessage("homeMsg", "这个组合下没有可做的题了，换个主题或难度。", "no");
  else if ($("homeMsg").textContent.indexOf("没有可做的题") >= 0)
    setMessage("homeMsg", "");
}

function renderChoices() {
  // 换了主题后，原来的难度可能没有题，回退到“不限难度”
  if (S.diff !== "all" && !hasAnyPuzzle(S.theme, S.diff)) {
    S.diff = "all";
    localStorage.setItem("zebra_diff", "all");
  }
  // 旧缓存里可能存着已下线的主题，回退到“不限主题”
  if (S.theme !== "all" && !META[S.theme]) {
    S.theme = "all";
    localStorage.setItem("zebra_theme", "all");
  }
  const tr = $("themeRow");
  tr.replaceChildren();
  ["all", ...Object.keys(META)].forEach((k) => {
    const off = false; /* 主题永远可点：切过去后难度会自动回退 */
    const b = button(
      k === "all" ? "不限主题" : THEME_NAMES[k],
      () => {
        S.theme = k;
        localStorage.setItem("zebra_theme", k);
        setMessage("homeMsg", "");
        if (S.diff !== "all" && !hasAnyPuzzle(k, S.diff)) {
          S.diff = "all";
          localStorage.setItem("zebra_diff", "all");
        }
        renderChoices();
        renderList();
      },
      "btn" + (S.theme === k ? " on" : "") + (off ? " off" : ""),
    );
    b.disabled = off;
    tr.appendChild(b);
  });

  const dr = $("diffRow");
  dr.replaceChildren();
  const bankDiffs = new Set(Object.keys(PUZ).map((key) => key.split("_")[1]));
  const diffOptions = { all: "不限难度" };
  Object.keys(DIFF_NAMES)
    .filter((d) => bankDiffs.has(d))
    .forEach((d) => (diffOptions[d] = DIFF_NAMES[d]));
  Object.keys(diffOptions).forEach((k) => {
    const off = k !== "all" && k !== S.diff && !hasAnyPuzzle(S.theme, k);
    const b = button(
      diffOptions[k],
      () => {
        S.diff = k;
        localStorage.setItem("zebra_diff", k);
        setMessage("homeMsg", "");
        renderChoices();
        renderList();
      },
      "btn" + (S.diff === k ? " on" : "") + (off ? " off" : ""),
    );
    b.disabled = off;
    dr.appendChild(b);
  });
  updateStartState();
}

function filteredPuzzles() {
  const out = [];
  for (const [key, items] of Object.entries(PUZ)) {
    const [theme, diff] = key.split("_");
    if (
      (S.theme !== "all" && theme !== S.theme) ||
      (S.diff !== "all" && diff !== S.diff)
    )
      continue;
    items.forEach((p) => out.push(hydrate(p, theme, diff)));
  }
  return out;
}

function puzzleStatus(p) {
  if ((REC.wins || []).includes(p.id)) return "已通关";
  if (REC.done.includes(p.id)) return "已做";
  return "未做";
}

function renderList() {
  const box = $("puzzleList");
  box.replaceChildren();
  const list = filteredPuzzles();
  const undone = list.filter((p) => !REC.done.includes(p.id)).length;
  box.appendChild(
    el(
      "p",
      "intro",
      `符合条件 ${list.length} 题 · 未做 ${undone} 题（看过答案也视为已做）。列表允许选择重玩。`,
    ),
  );
  list.forEach((p) => {
    box.appendChild(
      button(
        `${p.id.replace("v2-", "")} · ${THEME_NAMES[p.theme_key]} / ${DIFF_NAMES[p.difficulty]} · ${puzzleStatus(p)}`,
        () => {
          mode = "free";
          startGame(p);
        },
      ),
    );
  });
  updateStartState();
}

/* 成就：全部由档案字段推导，不单独存档 */
function achievementDefs() {
  const total = Object.values(REC.solved).reduce((n, v) => n + v.n, 0);
  const daily = REC.daily || [];
  return [
    ["初露锋芒", "独立完成第一道题", total >= 1],
    ["小猫侦探", "累计完成10道不同题", total >= 10],
    ["勇闯工坊", "完成一道困难题", (REC.solved.hard?.n || 0) > 0],
    ["每日赴约", "完成一次每日挑战", daily.length >= 1],
    ["七日手记", "累计完成7天每日挑战", daily.length >= 7],
    [
      "故事收藏家",
      `完成全部 ${CHAPTERS.length} 个故事`,
      CHAPTERS.every(storyDone),
    ],
  ];
}

function renderAchievements() {
  const box = $("achievements");
  box.replaceChildren();
  achievementDefs().forEach(([name, desc, unlocked]) => {
    const item = el("div", "stat");
    const title = el("b", null, (unlocked ? "★ " : "☆ ") + name);
    title.style.fontSize = "14px";
    item.append(
      title,
      el("span", null, desc + (unlocked ? " · 已解锁" : " · 未解锁")),
    );
    box.appendChild(item);
  });
}

/* 模式与故事：章节、标签、每日档案 */
const CHAPTERS = BANK.story || [];

const TAG_NAMES = {
  cat: "小猫",
  alva: "阿尔瓦",
  herman: "赫尔曼叔叔",
  luca: "卢卡",
  本格: "本格推理",
};

function stageDone(ch, j) {
  return (
    (REC.wins || []).includes(ch.stages[j].puzzle?.id) ||
    (ch.legacyIndex != null && (REC.story || []).includes(ch.legacyIndex))
  );
}

function storyDone(ch) {
  return ch.stages.every((_, j) => stageDone(ch, j));
}

function allTags() {
  const set = new Set();
  CHAPTERS.forEach((ch) => (ch.tags || []).forEach((t) => set.add(t)));
  return [...set];
}

/* 北京时间的日期键，每日题的唯一边界 */
function dayKey() {
  return new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
}

function renderTagRow() {
  if (S.tag !== "all" && !allTags().includes(S.tag)) {
    S.tag = "all";
    localStorage.setItem("zebra_tag", "all");
  }
  const box = $("tagRow");
  if (!box) return;
  box.replaceChildren();
  ["all", ...allTags()].forEach((t) => {
    box.appendChild(
      button(
        t === "all" ? "全部故事" : TAG_NAMES[t] || t,
        () => {
          S.tag = t;
          localStorage.setItem("zebra_tag", t);
          renderModes();
        },
        "btn" + (S.tag === t ? " on" : ""),
      ),
    );
  });
}

function modeInfo() {
  if (mode === "story")
    return `共 ${CHAPTERS.length} 个独立故事，自由选择，互不影响。故事内按阶段推进；看答案不算通关。`;
  if (mode === "daily") {
    const today = dayKey();
    const done = (REC.daily || []).includes(today);
    return `${today} · 每日生成新题，往期题目可在下方补做。${done ? " 今日已完成，可重玩。" : " 今日尚未完成。"}`;
  }
  return "按筛选条件随机抽取未做题；也可打开题目列表自主选择。左右均以屏幕从左到右为准；“左边”可以不相邻。";
}

function renderModes() {
  const daily = REC.daily || [];
  document
    .querySelectorAll("[data-mode]")
    .forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  $("modeInfo").textContent = modeInfo();

  $("storyStages")?.remove();
  const box = $("chapters");
  box.replaceChildren();
  const tagBox = $("storyTags");
  tagBox.classList.toggle("hidden", mode !== "story");
  renderTagRow();

  const visible = CHAPTERS.map((ch, i) => ({ ch, i })).filter(
    ({ ch }) => S.tag === "all" || (ch.tags || []).includes(S.tag),
  );
  if (!visible.some((x) => x.i === chapter) && visible.length) {
    chapter = visible[0].i;
    stage = 0;
  }
  if (mode === "story") renderStoryPicker(box, tagBox, visible);

  toggleHidden("freeFilters", mode !== "free");
  renderDailyArchive();
  toggleHidden("listBtn", mode !== "free");
  $("startBtn").textContent = mode === "free" ? "随机新题 →" : "开始推理 →";
  if (mode !== "free") toggleHidden("puzzleList", true);
  renderList();
  renderAchievements();
}

/* 故事选择：标签在上，章节列表在中，当前故事的阶段在下 */
function renderStoryPicker(box, tagBox, visible) {
  visible.forEach(({ ch, i }) => {
    const done = ch.stages.filter((_, j) => stageDone(ch, j)).length;
    const b = button(
      (storyDone(ch) ? "✓ " : "") +
        ch.title +
        " · " +
        done +
        "/" +
        ch.stages.length,
      () => {
        chapter = i;
        stage = Math.max(
          0,
          ch.stages.findIndex((_, j) => !stageDone(ch, j)),
        );
        renderModes();
      },
      "btn" + (chapter === i ? " on" : ""),
    );
    b.title = (ch.tags || []).map((t) => TAG_NAMES[t] || t).join(" · ");
    box.appendChild(b);
  });
  tagBox.after(box);

  const panel = el("div", "row");
  panel.id = "storyStages";
  const ch = CHAPTERS[chapter];
  if (!ch) return;
  panel.appendChild(el("p", "stage-heading", ch.title + " · 故事内阶段"));
  if (!ch.stages[stage] || (stage > 0 && !stageDone(ch, stage - 1))) {
    stage = Math.max(
      0,
      ch.stages.findIndex((_, j) => !stageDone(ch, j)),
    );
  }
  ch.stages.forEach((st, j) => {
    const b = button(
      (stageDone(ch, j) ? "✓ " : "") + "阶段 " + (j + 1) + " · " + st.title,
      () => {
        stage = j;
        renderModes();
      },
      "btn" + (stage === j ? " on" : ""),
    );
    b.disabled = j > 0 && !stageDone(ch, j - 1);
    panel.appendChild(b);
  });
  box.after(panel);
}

/* 每日档案：只列出今天与过去，未来预备题不显示 */
function renderDailyArchive() {
  const box = $("dailyArchive");
  box.classList.toggle("hidden", mode !== "daily");
  box.replaceChildren();
  box.appendChild(el("p", null, "每日档案 · 北京时间（可补做往期）"));
  if (!BANK.daily.some((p) => p.date === dayKey())) {
    const today = dayKey();
    const done = (REC.daily || []).includes(today);
    box.appendChild(
      button(
        `今天 · ${today} · 现场生成 · ${done ? "已通关" : "未完成"}`,
        () => {
          mode = "daily";
          startGame(GEN.daily(today));
        },
      ),
    );
  }
  BANK.daily
    .filter((p) => p.date <= dayKey())
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date))
    .forEach((p) => {
      const status = (REC.daily || []).includes(p.date)
        ? "已通关"
        : REC.done.includes(p.id)
          ? "已查看"
          : "未完成";
      box.appendChild(
        button(
          `${p.date} · ${THEME_NAMES[p.theme]} / ${DIFF_NAMES[p.diff]} · ${status}`,
          () => {
            mode = "daily";
            startGame({ ...hydrate(p, p.theme, p.diff), date: p.date });
          },
        ),
      );
    });
}

/* 进度码：Base64 编码 + 校验和，仅用于手动跨设备迁移 */
const SYNC_PREFIX = "ZBR3-";

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return btoa(bin).replace(/=+$/, "");
}

function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function checksum(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* 只导出进度字段；成就由这些字段重建，游玩流水不上传也不进码 */
function exportPayload() {
  return JSON.stringify({
    v: 3,
    d: [...new Set(REC.done || [])],
    w: [...new Set(REC.wins || [])],
    s: [...new Set(REC.story || [])],
    y: [...new Set(REC.daily || [])],
    t: REC.solved || {},
  });
}

function showSyncBox(label, value) {
  $("syncBox").classList.remove("hidden");
  $("syncLabel").textContent = label;
  $("syncText").value = value;
}

function doExport() {
  const body = b64enc(exportPayload());
  showSyncBox(
    "本地进度码 · 包含题目、成就进度与统计，不含游玩流水，不上传服务器",
    SYNC_PREFIX + body + "-" + checksum(body),
  );
  $("syncText").select();
  try {
    document.execCommand("copy");
  } catch (e) {}
}

function doImport() {
  showSyncBox("把另一台设备的同步码粘进来", "");
  $("syncText").focus();
}

function stringsOf(value) {
  if (!Array.isArray(value) || value.some((x) => typeof x !== "string"))
    throw new Error("Invalid progress");
  return [...new Set(value)];
}

function statsOf(data, compact) {
  const raw = (compact ? data.t : data.solved) || {};
  const solved = {};
  for (const key of Object.keys(DIFF_NAMES)) {
    const stat = raw[key];
    if (!stat) continue;
    const { n, best, total } = stat;
    if (
      !Number.isInteger(n) ||
      n < 0 ||
      !Number.isFinite(total) ||
      total < 0 ||
      !(best === null || (Number.isFinite(best) && best >= 0))
    )
      throw new Error("Invalid stats");
    solved[key] = { n, best, total };
  }
  return solved;
}

/* 校验并还原一份进度；任何字段不合法都拒绝导入，不覆盖本机档案 */
function decodeProgress(text) {
  const body = text.slice(5);
  const cut = body.lastIndexOf("-");
  if (cut < 0) throw syncError("incomplete");
  const payload = body.slice(0, cut),
    sum = body.slice(cut + 1);
  if (checksum(payload) !== sum) throw syncError("checksum");
  const data = JSON.parse(b64dec(payload));
  const compact = data.v === 3;
  const story = compact ? data.s : data.story || [];
  if (
    !Array.isArray(story) ||
    story.some((x) => !Number.isInteger(x) || x < 0 || x >= CHAPTERS.length)
  )
    throw new Error("Invalid story");
  return {
    solved: statsOf(data, compact),
    done: stringsOf((compact ? data.d : data.done) || []),
    wins: stringsOf((compact ? data.w : data.wins) || []),
    story: [...new Set(story)],
    daily: stringsOf((compact ? data.y : data.daily) || []),
    history: compact ? [] : Array.isArray(data.history) ? data.history : [],
  };
}

function syncError(code) {
  const error = new Error(code);
  error.code = code;
  return error;
}

function syncConfirm() {
  const txt = $("syncText").value.trim();
  if (!txt) return;
  if (!txt.startsWith("ZBR1-") && !txt.startsWith(SYNC_PREFIX))
    return alert("这不像是一个同步码。");
  try {
    REC = decodeProgress(txt);
  } catch (e) {
    return alert(
      e.code === "incomplete"
        ? "同步码不完整。"
        : e.code === "checksum"
          ? "同步码校验失败，可能复制时漏了字符。"
          : "同步码解析失败。",
    );
  }
  saveRec(REC);
  renderStats();
  $("syncBox").classList.add("hidden");
  alert("档案已导入。");
}

/* 事件绑定与启动 */
function bindEvents() {
  $("undoBtn").onclick = undoMove;
  $("resetBtn").onclick = resetBoard;
  $("hintBtn").onclick = hintCell;
  $("listBtn").onclick = () => {
    if ($("listBtn").disabled) return;
    renderList();
    $("puzzleList").classList.toggle("hidden");
  };

  document.querySelectorAll("[data-mode]").forEach((b) => {
    b.onclick = () => {
      mode = b.dataset.mode;
      setMessage("homeMsg", "");
      renderModes();
      updateStartState();
    };
  });

  $("startBtn").onclick = () => startGame();
  $("checkBtn").onclick = check;
  $("giveUpBtn").onclick = giveUp;
  $("backBtn").onclick = backHome;

  $("exportBtn").onclick = doExport;
  $("importBtn").onclick = doImport;
  $("syncDo").onclick = syncConfirm;
  $("syncCancel").onclick = () => $("syncBox").classList.add("hidden");
  $("clearBtn").onclick = () => {
    if (confirm("清空本机的全部记录？同步码可以留着备份。")) resetRecords();
  };
}

function init() {
  bindEvents();
  renderChoices();
  renderStats();
}

init();

/* 调试用：控制台里可以查看当前题目状态 */
window.ZEBRA = {
  S,
  get REC() {
    return REC;
  },
};
