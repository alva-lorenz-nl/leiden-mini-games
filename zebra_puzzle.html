<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>莱顿逻辑馆 · 小猫斑马谜题</title>
    <meta
      name="description"
      content="阿尔瓦写的逻辑谜题生成器，小猫专属的斑马游戏。三档难度、自动计时、档案可跨设备同步，每一题都保证唯一解。"
    />
    <meta name="tag" content="逻辑 · 推理" />
    <style>
      * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  --bg: #141110;
  --card: #1e1915;
  --card2: #241d17;
  --line: #3a2f24;
  --ink: #e9dfd0;
  --dim: #9a8b78;
  --amber: #e0a458;
  --amber2: #c98a3f;
  --good: #7fa86a;
  --bad: #c96a5a;
}
body {
  background: radial-gradient(circle at 50% 0%, #221b15, #141110 60%);
  color: var(--ink);
  font-family: "Noto Serif SC", Georgia, "Songti SC", serif;
  min-height: 100vh;
  padding: 26px 14px 70px;
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  width: min(880px, 100%);
}
header {
  text-align: center;
  margin-bottom: 22px;
}
.kicker {
  font-size: 10px;
  letter-spacing: 0.34em;
  color: var(--amber2);
  margin-bottom: 10px;
}
h1 {
  font-size: 23px;
  font-weight: 600;
  letter-spacing: 0.1em;
}
.sub {
  margin-top: 8px;
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 0.06em;
}
.rule {
  width: 44px;
  height: 1px;
  background: var(--line);
  margin: 18px auto 22px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 18px 16px;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 16px;
  cursor: pointer;
  transition: 0.18s;
  letter-spacing: 0.06em;
}
.btn:hover {
  border-color: #5c4630;
  color: var(--amber);
}
.btn.primary {
  background: linear-gradient(180deg, #3a2c1d, #2a2015);
  border-color: #5c4630;
  color: var(--amber);
}
.btn.on {
  border-color: var(--amber2);
  color: var(--amber);
  background: #2e2418;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.label {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--dim);
  margin: 16px 0 9px;
}
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 12px;
  letter-spacing: 0.06em;
}
.timer {
  font-variant-numeric: tabular-nums;
  color: var(--amber);
  font-size: 14px;
}
.intro {
  font-size: 12.5px;
  color: var(--dim);
  line-height: 1.9;
  margin-bottom: 14px;
}

table {
  border-collapse: separate;
  border-spacing: 5px;
  width: 100%;
  table-layout: fixed;
}
th {
  font-size: 10.5px;
  color: var(--dim);
  font-weight: 400;
  letter-spacing: 0.08em;
  padding-bottom: 2px;
}
th.rowh {
  text-align: right;
  padding-right: 8px;
  color: var(--amber2);
  width: 64px;
  font-size: 11px;
}
td {
  padding: 0;
}
.cell {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #1a1512;
  color: var(--ink);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: 0.15s;
  letter-spacing: 0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cell:hover {
  border-color: #5c4630;
}
.cell.filled {
  background: #2b2118;
  color: var(--amber);
}
.cell.wrong {
  border-color: var(--bad);
  color: var(--bad);
  animation: shake 0.3s;
}
.cell.right {
  border-color: var(--good);
  color: var(--good);
}
@keyframes shake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-3px);
  }
  75% {
    transform: translateX(3px);
  }
}

.clues {
  margin-top: 16px;
  font-size: 12.5px;
  line-height: 2.05;
  color: #cbbca6;
}
.clues li {
  margin-left: 20px;
  padding-left: 2px;
}
.clues li::marker {
  color: #6b5a44;
  font-size: 11px;
}
.q {
  margin-top: 16px;
  padding: 12px 14px;
  border-left: 2px solid var(--amber2);
  background: #221a13;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: var(--amber);
}
.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.msg {
  font-size: 12.5px;
  letter-spacing: 0.05em;
  min-height: 18px;
}
.msg.ok {
  color: var(--good);
}
.msg.no {
  color: var(--bad);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 6px;
}
.stat {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px 14px;
}
.stat b {
  display: block;
  font-size: 19px;
  color: var(--amber);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.stat span {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.1em;
}
textarea {
  width: 100%;
  height: 76px;
  background: #1a1512;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  padding: 10px;
  resize: vertical;
  line-height: 1.6;
}
.hidden {
  display: none !important;
}
.hist {
  font-size: 11.5px;
  color: var(--dim);
  line-height: 1.9;
  margin-top: 10px;
  max-height: 150px;
  overflow: auto;
}
footer {
  margin-top: 30px;
  text-align: center;
  font-size: 11px;
  color: #5f5546;
  letter-spacing: 0.1em;
}
select.cell {
  padding: 0 4px;
  white-space: normal;
  color-scheme: dark;
}
#puzzleList {
  max-height: 350px;
  overflow: auto;
  display: grid;
  gap: 8px;
  margin-top: 12px;
}
#puzzleList button {
  text-align: left;
}
@media (max-width: 550px) {
  table {
    min-width: 520px;
  }
}
.table-scroll {
  overflow-x: auto;
}

.clue-scroll {
  max-height: min(42vh, 360px);
  overflow-y: auto;
  overscroll-behavior-y: contain;
  scrollbar-gutter: stable;
  padding-right: 6px;
  scrollbar-width: thin;
  scrollbar-color: #574434 transparent;
}
.clue-scroll:focus-visible {
  outline: 2px solid var(--amber2);
}
.clues .clue-status {
  display: inline-block;
  width: 1.6em;
  text-decoration: none;
}
.clues .satisfied .clue-text {
  text-decoration: line-through;
  opacity: 0.55;
}
.clues .satisfied .clue-status {
  color: #73d99a;
}
.clues .conflict {
  color: #ff777f;
}

.clue-scroll::-webkit-scrollbar {
  width: 6px;
}
.clue-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.clue-scroll::-webkit-scrollbar-thumb {
  background: #49392c;
  border-radius: 8px;
}
.clue-scroll:hover::-webkit-scrollbar-thumb {
  background: #6b5037;
}
.clue-scroll .clues {
  margin-top: 2px;
}
.clues li {
  padding-top: 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid rgba(154, 139, 120, 0.09);
}
.clues li:last-child {
  border-bottom: none;
}
.clues .satisfied .clue-status {
  color: var(--good);
}
.clues .conflict {
  color: #dd8677;
}
.card {
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
}
.cell:focus-visible,
.btn:focus-visible {
  outline: 2px solid var(--amber2);
  outline-offset: 2px;
}
.q {
  background: linear-gradient(90deg, rgba(224, 164, 88, 0.055), transparent);
}

/* 故事档案 */
.story-box {
  margin-top: 14px;
  padding: 14px 16px;
  border: 1px solid #3a2f24;
  border-radius: 10px;
  background: #1c1712;
}
.story-box .label {
  margin-top: 10px;
}
.story-box .label:first-child {
  margin-top: 0;
}
.story-box .frag {
  margin: 8px 0 0;
  font-size: 13px;
  line-height: 1.85;
  color: var(--dim);
}
.story-box .frag b {
  color: var(--amber);
  font-weight: 500;
}
.story-box .ending {
  margin: 8px 0 0;
  font-size: 13px;
  line-height: 1.9;
  color: var(--amber);
}
#storyTags .row {
  margin-top: 4px;
}

.stage-heading {
  flex-basis: 100%;
  margin: 14px 0 4px;
  font-weight: 600;
}
#storyStages {
  margin-bottom: 14px;
}

.table-hint {
  display: none;
  font-size: 12px;
  color: var(--dim);
}
@media (max-width: 700px) {
  .table-hint {
    display: block;
  }
}

    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="kicker">LEIDEN LOGIC ROOM</div>
        <h1>小猫斑马谜题</h1>
        <div class="sub">阿尔瓦写的逻辑生成器 · 每题唯一解</div>
        <div class="rule"></div>
      </header>

      <!-- 首页 -->
      <section id="home">
        <div class="card">
          <div class="label">玩法</div>
          <div class="row">
            <button class="btn on" data-mode="free">自由推理</button
            ><button class="btn" data-mode="story">故事模式</button
            ><button class="btn" data-mode="daily">每日挑战</button>
          </div>
          <p class="intro" id="modeInfo"></p>
          <div id="chapters" class="row"></div>
          <div id="storyTags" class="hidden">
            <div class="label">故事标签</div>
            <div class="row" id="tagRow"></div>
          </div>
          <div id="freeFilters">
            <div class="label">主题</div>
            <div class="row" id="themeRow"></div>
            <div class="label">难度</div>
            <div class="row" id="diffRow"></div>
          </div>
          <div id="dailyArchive" class="hidden"></div>
          <div class="foot">
            <div class="msg" id="homeMsg" role="status"></div>
            <button class="btn" id="listBtn">题目列表</button
            ><button class="btn primary" id="startBtn">随机未做题 →</button>
          </div>
        </div>

        <div id="puzzleList" class="hidden"></div>
        <div class="card" style="margin-top: 14px">
          <div class="label">成就</div>
          <div id="achievements" class="stats"></div>
          <div class="label">档案</div>
          <div class="stats" id="statBox"></div>
          <div class="hist" id="histBox"></div>
          <div class="foot">
            <div class="row">
              <button class="btn" id="exportBtn">导出同步码</button>
              <button class="btn" id="importBtn">导入同步码</button>
            </div>
            <button class="btn" id="clearBtn">清空档案</button>
          </div>
          <div id="syncBox" class="hidden" style="margin-top: 12px">
            <div class="label" id="syncLabel">
              同步码（复制到别的设备粘贴导入）
            </div>
            <textarea id="syncText" spellcheck="false"></textarea>
            <div class="row" style="margin-top: 8px">
              <button class="btn" id="syncDo">确认</button>
              <button class="btn" id="syncCancel">取消</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 谜题 -->
      <section id="game" class="hidden">
        <div class="card">
          <div class="meta">
            <div id="gameTitle">—</div>
            <div class="timer" id="timer">00:00</div>
          </div>
          <div class="intro" id="intro"></div>
          <p class="table-hint">表格可左右滑动，查看全部位置。</p>
          <div
            class="table-scroll"
            tabindex="0"
            role="region"
            aria-label="推理表格，可左右滚动"
          >
            <table id="grid"></table>
          </div>
          <div class="q" id="question"></div>
          <div id="storyBox" class="story-box hidden"></div>
          <div class="foot">
            <div class="msg" id="gameMsg"></div>
            <div class="row">
              <button class="btn" id="undoBtn" disabled>撤回一步</button>
              <button class="btn" id="resetBtn" disabled>重置本题</button>
              <button class="btn" id="giveUpBtn">看答案</button>
              <button class="btn" id="backBtn">回首页</button>
              <button class="btn primary" id="checkBtn">提交检查</button>
            </div>
          </div>
        </div>

        <div class="card" style="margin-top: 14px">
          <div class="label">线索</div>
          <p class="intro">线索随填表自动更新：✓ 满足 · ✕ 冲突 · □ 待确定</p>
          <div
            class="clue-scroll"
            tabindex="0"
            role="region"
            aria-label="线索列表，可上下滚动"
          >
            <ol class="clues" id="clues"></ol>
          </div>
        </div>
      </section>

      <footer>莱顿小游戏柜 · 慢慢做，慢慢加</footer>
    </div>

const META = BANK.meta,
  PUZ = BANK.puzzles;

const THEME_NAMES = {};
Object.keys(META).forEach((k) => (THEME_NAMES[k] = META[k].title));
const DIFF_NAMES = { easy: "简单", normal: "普通", hard: "困难" };

/* 把精简题库还原成页面用的结构 */
function hydrate(p, theme, diff) {
  const cats = {};
  p.k.forEach((c) => (cats[c] = META[theme].cats[c]));
  return {
    id: p.id,
    theme_key: theme,
    theme: META[theme].title,
    intro: META[theme].intro,
    difficulty: diff,
    categories: cats,
    clue_count: p.n,
    clues: p.c,
    rawClues: p.r,
    question: p.q,
    answer: p.a,
    solution: p.s,
  };
}

/* 把故事章节的谜题还原成页面用的结构 */
function hydrateStory(ch, i) {
  const p = ch.puzzle;
  return {
    id: p.id,
    theme_key: "story",
    theme: ch.title,
    chapterIndex: i,
    intro: p.intro,
    difficulty: p.diff,
    categories: p.cats,
    colLabels: p.cols || null,
    clue_count: p.c.length,
    clues: p.c,
    rawClues: p.r,
    question: p.q,
    answer: p.a,
    solution: p.s,
    fragments: p.frag || [],
    ending: p.end,
  };
}

/* 页面级状态：模式选择、当前题、填表、计时 */
const S = {
  theme: localStorage.getItem("zebra_theme") || "cat",
  diff: localStorage.getItem("zebra_diff") || "easy",
  tag: localStorage.getItem("zebra_tag") || "all",
  n: 5,
  cur: null, // 当前题目
  assign: null, // {类别: [null x n]}
  t0: 0,
  timerId: null,
  elapsed: 0,
  solved: false,
};

let mode = "free", // free | story | daily
  chapter = 0, // 故事模式下选中的章节
  stage = 0; // 故事模式下选中的阶段

/* 轻量 DOM 工具，避免各模块重复拼节点 */
const $ = (id) => document.getElementById(id);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function button(text, onClick, className = "btn") {
  const node = el("button", className, text);
  node.onclick = onClick;
  return node;
}

/* 统一消息区的文字与状态样式："" | "ok" | "no" */
function setMessage(id, text, kind = "") {
  const node = $(id);
  node.textContent = text;
  node.className = "msg" + (kind ? " " + kind : "");
}

function toggleHidden(id, hidden) {
  $(id).classList.toggle("hidden", hidden);
}

function formatClock(sec) {
  sec = Math.round(sec);
  const m = Math.floor(sec / 60),
    s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/* 本地档案：读取校验、保存、统计与历史 */
const EMPTY_RECORD = () => ({ solved: {}, history: [], done: [] });

function loadRec() {
  try {
    const raw = localStorage.getItem("zebra_records");
    if (raw) {
      const data = JSON.parse(raw);
      if (data && typeof data === "object" && !Array.isArray(data)) {
        const records = EMPTY_RECORD();
        for (const key of ["done", "wins", "daily"])
          records[key] = Array.isArray(data[key])
            ? data[key].filter((x) => typeof x === "string")
            : [];
        records.story = Array.isArray(data.story)
          ? data.story.filter((x) => Number.isInteger(x) && x >= 0)
          : [];
        records.history = Array.isArray(data.history)
          ? data.history.filter((x) => x && typeof x === "object").slice(0, 60)
          : [];
        for (const key of Object.keys(DIFF_NAMES)) {
          const stat = data.solved?.[key];
          if (
            stat &&
            Number.isInteger(stat.n) &&
            stat.n >= 0 &&
            Number.isFinite(stat.total) &&
            stat.total >= 0 &&
            (stat.best === null ||
              (Number.isFinite(stat.best) && stat.best >= 0))
          )
            records.solved[key] = {
              n: stat.n,
              best: stat.best,
              total: stat.total,
            };
        }
        return records;
      }
    }
  } catch (e) {}
  return EMPTY_RECORD();
}

function saveRec(r) {
  localStorage.setItem("zebra_records", JSON.stringify(r));
}

function resetRecords() {
  REC = EMPTY_RECORD();
  saveRec(REC);
  renderStats();
}

let REC = loadRec();

const fmt = formatClock;

/* 记录一次作答。同一题只记一次，看答案也计入“已做”。 */
function record(sec, ok) {
  if (S.recorded) return;
  S.recorded = true;
  REC.story = REC.story || [];
  REC.daily = REC.daily || [];
  if (
    ok &&
    S.mode === "story" &&
    CHAPTERS[S.chapter].stages.length === 1 &&
    !REC.story.includes(S.chapter)
  )
    REC.story.push(S.chapter);
  if (ok && S.mode === "daily" && !REC.daily.includes(S.day))
    REC.daily.push(S.day);
  if (ok && S.mode === "story") showStoryResult();

  const p = S.cur;
  const d = p.difficulty;
  if (!REC.solved[d]) REC.solved[d] = { n: 0, best: null, total: 0 };
  if (ok && !(REC.wins || []).includes(p.id)) {
    REC.wins = REC.wins || [];
    REC.wins.push(p.id);
    const s = REC.solved[d];
    s.n++;
    s.total += sec;
    s.best = s.best == null ? sec : Math.min(s.best, sec);
  }
  if (!REC.done.includes(p.id)) REC.done.push(p.id);
  const now = new Date();
  REC.history.unshift({
    time: `${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`,
    theme: p.theme_key,
    diff: d,
    sec: Math.round(sec),
    ok,
    mode: S.mode,
  });
  REC.history = REC.history.slice(0, 60);
  saveRec(REC);
  renderStats();
}

/* 档案面板：各难度统计与最近记录 */
function renderStats() {
  renderModes();
  const box = $("statBox");
  box.replaceChildren();
  ["easy", "normal", "hard"].forEach((d) => {
    const s = REC.solved[d] || { n: 0, best: null, total: 0 };
    const avg = s.n ? fmt(s.total / s.n) : "—";
    const item = el("div", "stat");
    const count = el("b", null, `${s.n} 题`);
    const detail = el(
      "span",
      null,
      `${DIFF_NAMES[d]} · 最快 ${s.best == null ? "—" : fmt(s.best)} · 平均 ${avg}`,
    );
    item.append(count, detail);
    box.appendChild(item);
  });

  const h = $("histBox");
  h.style.whiteSpace = "pre-line";
  if (!REC.history.length) {
    h.textContent = "还没有记录。做一题，这里就会留下痕迹。";
    return;
  }
  h.textContent = REC.history
    .filter((x) => x && typeof x === "object")
    .slice(0, 12)
    .map(
      (x) =>
        `· ${x.time}　${THEME_NAMES[x.theme] || x.theme} / ${DIFF_NAMES[x.diff] || x.diff}　${x.ok ? "完成" : "查看答案"} · 用时 ${fmt(x.sec)}`,
    )
    .join("\n");
}

/* Evaluate only the player's entries, never the stored solution.
 * Unplaced values can occupy any blank cell in their category.
 * Mark fulfilled only when the referenced values have actually been placed.
 */
function clueState(clue, assignments) {
  const [kind, category, value, otherCategory, otherValue] = clue;
  function positions(cat, val) {
    const row = assignments[cat];
    const index = row.indexOf(val);
    return index >= 0 ? [index + 1] : row.flatMap((v, i) => (v ? [] : [i + 1]));
  }
  const left = positions(category, value);
  const placedLeft = assignments[category].includes(value);
  if (kind === "pos") {
    if (!left.includes(otherCategory)) return "conflict";
    return placedLeft ? "satisfied" : "pending";
  }
  const right = positions(otherCategory, otherValue);
  const relation = {
    same: (a, b) => a === b,
    next: (a, b) => b === a + 1,
    left: (a, b) => a < b,
  }[kind];
  if (!relation) return "pending";
  const possible = left.some((a) =>
    right.some(
      (b) =>
        !(category === otherCategory && value !== otherValue && a === b) &&
        relation(a, b),
    ),
  );
  if (!possible) return "conflict";
  return placedLeft && assignments[otherCategory].includes(otherValue)
    ? "satisfied"
    : "pending";
}

function renderClues() {
  const list = document.getElementById("clues");
  list.replaceChildren();
  S.cur.clues.forEach((text) => {
    const item = document.createElement("li");
    const status = document.createElement("span");
    status.className = "clue-status";
    const label = document.createElement("span");
    label.className = "clue-text";
    label.textContent = text;
    item.append(status, label);
    list.appendChild(item);
  });
  list.parentElement.scrollTop = 0;
}

function updateClues() {
  if (!S.cur) return;
  const labels = {
    pending: "待确定",
    satisfied: "已满足",
    conflict: "与当前填表冲突",
  };
  const symbols = { pending: "□", satisfied: "✓", conflict: "✕" };
  document.querySelectorAll("#clues li").forEach((item, i) => {
    const state = clueState(S.cur.rawClues[i], S.assign);
    item.className = state;
    item.dataset.state = state;
    const status = item.querySelector(".clue-status");
    status.textContent = symbols[state];
    status.setAttribute("aria-label", labels[state]);
    item.title = labels[state];
  });
}

/* 故事模式：通关档案、下一阶段入口 */
function renderStoryArchive(fragments, ending) {
  const box = $("storyBox");
  if (!box) return;
  box.replaceChildren();
  box.classList.remove("hidden");
  if (fragments.length) {
    box.appendChild(el("div", "label", "案件档案 · 逐层揭开"));
    fragments.forEach((f) => {
      const item = el("p", "frag");
      item.append(
        el("b", null, f.title + "　"),
        document.createTextNode(f.text),
      );
      box.appendChild(item);
    });
  }
  if (ending) {
    box.appendChild(el("div", "label", "收尾小剧场"));
    box.appendChild(el("p", "ending", ending));
  }
  if (box.scrollIntoView)
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* 通关当前阶段后，展示剧情并允许继续下一阶段 */
function showStoryResult() {
  const ch = CHAPTERS[S.chapter];
  if (!ch) return;
  const stageData = ch.stages[S.stage];
  const p = S.cur;
  const ending = (p.ending || stageData.ending || "").trim();
  renderStoryArchive(p.fragments || [], ending);
  if (S.stage + 1 >= ch.stages.length) return;
  const next = button(
    "继续下一阶段 →",
    () => {
      chapter = S.chapter;
      stage = S.stage + 1;
      mode = "story";
      startGame();
    },
    "btn primary",
  );
  next.id = "nextStageBtn";
  $("storyBox").appendChild(next);
}

/* 开局：选题、初始化状态、计时 */
function pickPuzzle() {
  if (mode === "story") {
    const ch = CHAPTERS[chapter]?.stages[stage];
    if (!ch || (stage > 0 && !stageDone(CHAPTERS[chapter], stage - 1)))
      return null;
    const title = CHAPTERS[chapter].title + " · " + ch.title;
    if (ch.src) {
      const p = hydrate(
        PUZ[ch.src.theme + "_" + ch.src.diff][ch.src.index],
        ch.src.theme,
        ch.src.diff,
      );
      return { ...p, theme: title };
    }
    return hydrateStory({ ...ch, title }, chapter);
  }
  if (mode === "daily") {
    const item = BANK.daily.find((p) => p.date === dayKey());
    return item
      ? { ...hydrate(item, item.theme, item.diff), date: item.date }
      : null;
  }
  const pool = filteredPuzzles().filter((p) => !REC.done.includes(p.id));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

function startGame(selected) {
  const p = selected && selected.id ? selected : pickPuzzle();
  if (!p) {
    $("homeMsg").textContent =
      mode === "daily"
        ? "今日题目尚未发布，请稍后刷新；可以先做历史每日题。"
        : "当前筛选下没有未做题了；请放宽条件，或从题目列表选择重玩。";
    return;
  }
  S.cur = p;
  S.mode = mode;
  S.chapter = chapter;
  S.stage = stage;
  S.day = p.date || dayKey();
  S.recorded = false;
  S.undoStack = [];
  S.assign = {};
  S.n = p.categories[Object.keys(p.categories)[0]].length;
  Object.keys(p.categories).forEach(
    (c) => (S.assign[c] = new Array(S.n).fill(null)),
  );
  S.solved = false;

  const storyBox = $("storyBox");
  storyBox.classList.add("hidden");
  storyBox.replaceChildren();
  toggleHidden("home", true);
  toggleHidden("game", false);
  $("gameTitle").textContent = puzzleTitle(p);
  $("intro").textContent = puzzleIntro(p);
  $("question").textContent = "追问：" + p.question;
  setMessage("gameMsg", "");
  $("checkBtn").disabled = false;
  $("giveUpBtn").disabled = false;

  renderClues();
  renderGrid();
  startTimer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function puzzleTitle(p) {
  const theme =
    S.mode === "story" ? p.theme : THEME_NAMES[p.theme_key] || p.theme;
  return `${theme} · ${DIFF_NAMES[p.difficulty] || p.difficulty} · ${p.clue_count} 条线索`;
}

function puzzleIntro(p) {
  if (S.mode === "story") {
    const ch = CHAPTERS[S.chapter];
    return (ch.stages[S.stage].intro || ch.intro) + " " + p.intro;
  }
  if (S.mode === "daily") return S.day + " 每日挑战（北京时间）。 " + p.intro;
  return p.intro;
}

function startTimer() {
  clearInterval(S.timerId);
  S.t0 = Date.now();
  S.elapsed = 0;
  $("timer").textContent = "00:00";
  S.timerId = setInterval(() => {
    S.elapsed = (Date.now() - S.t0) / 1000;
    $("timer").textContent = fmt(S.elapsed);
  }, 250);
}

function stopTimer() {
  clearInterval(S.timerId);
  S.timerId = null;
}

function backHome() {
  stopTimer();
  toggleHidden("game", true);
  toggleHidden("home", false);
  renderStats();
}

/* 棋盘：渲染表格、填值、撤回/重置、提交与看答案 */
function renderGrid() {
  updateClues();
  updateEditButtons();
  const p = S.cur,
    tb = $("grid");
  tb.replaceChildren();

  const head = document.createElement("tr");
  head.appendChild(document.createElement("th"));
  for (let i = 1; i <= S.n; i++) {
    head.appendChild(
      el("th", null, p.colLabels ? p.colLabels[i - 1] : "第" + i + "位"),
    );
  }
  tb.appendChild(head);

  const cats = Object.keys(p.categories);
  cats.forEach((cat, rowIndex) => {
    const tr = document.createElement("tr");
    tr.appendChild(el("th", "rowh", cat));
    for (let i = 0; i < S.n; i++) {
      const td = document.createElement("td");
      td.appendChild(cellSelect(p, cat, i, rowIndex));
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
}

function cellSelect(p, cat, i, rowIndex) {
  const b = document.createElement("select");
  b.className = "cell";
  b.dataset.cat = cat;
  b.dataset.idx = i;
  b.setAttribute("aria-label", cat + "，第" + (i + 1) + "位");
  b.appendChild(new Option("请选择", ""));
  p.categories[cat].forEach((value) => b.appendChild(new Option(value, value)));
  b.value = S.assign[cat][i] || "";
  b.disabled = S.solved;
  if (b.value) b.classList.add("filled");
  b.onchange = () => {
    setCell(cat, i, b.value || null);
    // 重绘后把焦点放回同一格，方便连续填写
    document.querySelectorAll("select.cell")[rowIndex * S.n + i]?.focus();
  };
  return b;
}

function setCell(cat, idx, v) {
  if (S.solved || S.assign[cat][idx] === v) return;
  S.undoStack.push(copyAssignments());
  clearEditMessage();
  // 同一类别里同一个值只能出现一次，若重复则清掉原来那格
  if (v) {
    const old = S.assign[cat].indexOf(v);
    if (old >= 0 && old !== idx) S.assign[cat][old] = null;
  }
  S.assign[cat][idx] = v;
  renderGrid();
}

/* 整表快照：移动重复值造成的原格清空也作为一步撤回 */
function copyAssignments() {
  return Object.fromEntries(
    Object.entries(S.assign).map(([cat, row]) => [cat, row.slice()]),
  );
}

function clearEditMessage() {
  setMessage("gameMsg", "");
}

function updateEditButtons() {
  $("undoBtn").disabled = S.solved || !S.undoStack?.length;
  $("resetBtn").disabled =
    S.solved || !Object.values(S.assign).some((row) => row.some(Boolean));
}

function undoMove() {
  if (S.solved || !S.undoStack.length) return;
  S.assign = S.undoStack.pop();
  clearEditMessage();
  renderGrid();
}

function resetBoard() {
  if (S.solved || !Object.values(S.assign).some((row) => row.some(Boolean)))
    return;
  if (
    !confirm(
      "确定清空本题的所有填写吗？计时继续，已保存的档案不受影响；清空后可以撤回。",
    )
  )
    return;
  S.undoStack.push(copyAssignments());
  Object.keys(S.assign).forEach((cat) => S.assign[cat].fill(null));
  clearEditMessage();
  renderGrid();
}

/* 返回空格数、错误格数；只看玩家填表，不提前泄露答案 */
function inspectBoard() {
  const p = S.cur;
  let blanks = 0,
    wrong = 0;
  Object.keys(p.categories).forEach((cat) => {
    p.categories[cat].forEach((_, i) => {
      const mine = S.assign[cat][i];
      if (!mine) blanks++;
      else if (mine !== p.solution[cat][i]) wrong++;
    });
  });
  return { blanks, wrong };
}

function check() {
  if (S.solved) return;
  const { blanks, wrong } = inspectBoard();
  if (blanks)
    return setMessage("gameMsg", "还有空格没填。慢慢来，不急。", "no");
  if (wrong) {
    setMessage("gameMsg", `有 ${wrong} 格不对。线索是够用的，再推一推。`, "no");
    document.querySelectorAll(".cell").forEach((b) => {
      const cat = b.dataset.cat,
        i = +b.dataset.idx,
        v = S.assign[cat][i];
      if (v && v !== S.cur.solution[cat][i]) b.classList.add("wrong");
    });
    return;
  }
  finishBoard(true);
}

function giveUp() {
  if (S.solved) return;
  if (
    !confirm("确定查看答案吗？本题将标记为已做，本次不计通关，也不会解锁成就。")
  )
    return;
  const p = S.cur;
  Object.keys(p.categories).forEach((cat) => {
    S.assign[cat] = p.solution[cat].slice();
  });
  finishBoard(false);
}

/* 结束本题：锁定棋盘、停表、显示结果并写入档案 */
function finishBoard(ok) {
  S.solved = true;
  stopTimer();
  updateEditButtons();
  renderGrid();
  document.querySelectorAll(".cell").forEach((b) => {
    b.classList.add("right");
    b.disabled = true;
  });
  $("checkBtn").disabled = true;
  $("giveUpBtn").disabled = true;
  if (ok)
    setMessage(
      "gameMsg",
      `全对！用时 ${fmt(S.elapsed)}。答案是「${S.cur.answer.value}」。`,
      "ok",
    );
  else setMessage("gameMsg", `答案是：${S.cur.answer.value}。`);
  record(S.elapsed, ok);
}

/* 自由推理：主题/难度筛选与题目列表 */
function renderChoices() {
  // 旧缓存里可能存着已下线的主题，回退到“不限主题”
  if (S.theme !== "all" && !META[S.theme]) {
    S.theme = "all";
    localStorage.setItem("zebra_theme", "all");
  }
  const tr = $("themeRow");
  tr.replaceChildren();
  ["all", ...Object.keys(META)].forEach((k) => {
    tr.appendChild(
      button(
        k === "all" ? "不限主题" : THEME_NAMES[k],
        () => {
          S.theme = k;
          localStorage.setItem("zebra_theme", k);
          renderChoices();
          renderList();
        },
        "btn" + (S.theme === k ? " on" : ""),
      ),
    );
  });

  const dr = $("diffRow");
  dr.replaceChildren();
  Object.keys({ all: "不限难度", ...DIFF_NAMES }).forEach((k) => {
    dr.appendChild(
      button(
        k === "all" ? "不限难度" : DIFF_NAMES[k],
        () => {
          S.diff = k;
          localStorage.setItem("zebra_diff", k);
          renderChoices();
          renderList();
        },
        "btn" + (S.diff === k ? " on" : ""),
      ),
    );
  });
}

function filteredPuzzles() {
  const out = [];
  for (const [key, items] of Object.entries(PUZ)) {
    const [theme, diff] = key.split("_");
    if (
      (S.theme !== "all" && theme !== S.theme) ||
      (S.diff !== "all" && diff !== S.diff)
    )
      continue;
    items.forEach((p) => out.push(hydrate(p, theme, diff)));
  }
  return out;
}

function puzzleStatus(p) {
  if ((REC.wins || []).includes(p.id)) return "已通关";
  if (REC.done.includes(p.id)) return "已做";
  return "未做";
}

function renderList() {
  const box = $("puzzleList");
  box.replaceChildren();
  const list = filteredPuzzles();
  const undone = list.filter((p) => !REC.done.includes(p.id)).length;
  box.appendChild(
    el(
      "p",
      "intro",
      `符合条件 ${list.length} 题 · 未做 ${undone} 题（看过答案也视为已做）。列表允许选择重玩。`,
    ),
  );
  list.forEach((p) => {
    box.appendChild(
      button(
        `${p.id.replace("v2-", "")} · ${THEME_NAMES[p.theme_key]} / ${DIFF_NAMES[p.difficulty]} · ${puzzleStatus(p)}`,
        () => {
          mode = "free";
          startGame(p);
        },
      ),
    );
  });
}

/* 成就：全部由档案字段推导，不单独存档 */
function achievementDefs() {
  const total = Object.values(REC.solved).reduce((n, v) => n + v.n, 0);
  const daily = REC.daily || [];
  return [
    ["初露锋芒", "独立完成第一道题", total >= 1],
    ["小猫侦探", "累计完成10道不同题", total >= 10],
    ["勇闯工坊", "完成一道困难题", (REC.solved.hard?.n || 0) > 0],
    ["每日赴约", "完成一次每日挑战", daily.length >= 1],
    ["七日手记", "累计完成7天每日挑战", daily.length >= 7],
    [
      "故事收藏家",
      `完成全部 ${CHAPTERS.length} 个故事`,
      CHAPTERS.every(storyDone),
    ],
  ];
}

function renderAchievements() {
  const box = $("achievements");
  box.replaceChildren();
  achievementDefs().forEach(([name, desc, unlocked]) => {
    const item = el("div", "stat");
    const title = el("b", null, (unlocked ? "★ " : "☆ ") + name);
    title.style.fontSize = "14px";
    item.append(
      title,
      el("span", null, desc + (unlocked ? " · 已解锁" : " · 未解锁")),
    );
    box.appendChild(item);
  });
}

/* 模式与故事：章节、标签、每日档案 */
const CHAPTERS = BANK.story || [];

const TAG_NAMES = {
  cat: "小猫",
  alva: "阿尔瓦",
  herman: "赫尔曼叔叔",
  luca: "卢卡",
  本格: "本格推理",
};

function stageDone(ch, j) {
  return (
    (REC.wins || []).includes(ch.stages[j].puzzle?.id) ||
    (ch.legacyIndex != null && (REC.story || []).includes(ch.legacyIndex))
  );
}

function storyDone(ch) {
  return ch.stages.every((_, j) => stageDone(ch, j));
}

function allTags() {
  const set = new Set();
  CHAPTERS.forEach((ch) => (ch.tags || []).forEach((t) => set.add(t)));
  return [...set];
}

/* 北京时间的日期键，每日题的唯一边界 */
function dayKey() {
  return new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
}

function renderTagRow() {
  if (S.tag !== "all" && !allTags().includes(S.tag)) {
    S.tag = "all";
    localStorage.setItem("zebra_tag", "all");
  }
  const box = $("tagRow");
  if (!box) return;
  box.replaceChildren();
  ["all", ...allTags()].forEach((t) => {
    box.appendChild(
      button(
        t === "all" ? "全部故事" : TAG_NAMES[t] || t,
        () => {
          S.tag = t;
          localStorage.setItem("zebra_tag", t);
          renderModes();
        },
        "btn" + (S.tag === t ? " on" : ""),
      ),
    );
  });
}

function modeInfo() {
  if (mode === "story")
    return `共 ${CHAPTERS.length} 个独立故事，自由选择，互不影响。故事内按阶段推进；看答案不算通关。`;
  if (mode === "daily") {
    const today = dayKey();
    const done = (REC.daily || []).includes(today);
    return `${today} · 每日生成新题，往期题目可在下方补做。${done ? " 今日已完成，可重玩。" : " 今日尚未完成。"}`;
  }
  return "按筛选条件随机抽取未做题；也可打开题目列表自主选择。左右均以屏幕从左到右为准；“左边”可以不相邻。";
}

function renderModes() {
  const daily = REC.daily || [];
  document
    .querySelectorAll("[data-mode]")
    .forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  $("modeInfo").textContent = modeInfo();

  $("storyStages")?.remove();
  const box = $("chapters");
  box.replaceChildren();
  const tagBox = $("storyTags");
  tagBox.classList.toggle("hidden", mode !== "story");
  renderTagRow();

  const visible = CHAPTERS.map((ch, i) => ({ ch, i })).filter(
    ({ ch }) => S.tag === "all" || (ch.tags || []).includes(S.tag),
  );
  if (!visible.some((x) => x.i === chapter) && visible.length) {
    chapter = visible[0].i;
    stage = 0;
  }
  if (mode === "story") renderStoryPicker(box, tagBox, visible);

  toggleHidden("freeFilters", mode !== "free");
  renderDailyArchive();
  toggleHidden("listBtn", mode !== "free");
  $("startBtn").textContent = mode === "free" ? "随机未做题 →" : "开始推理 →";
  if (mode !== "free") toggleHidden("puzzleList", true);
  renderList();
  renderAchievements();
}

/* 故事选择：标签在上，章节列表在中，当前故事的阶段在下 */
function renderStoryPicker(box, tagBox, visible) {
  visible.forEach(({ ch, i }) => {
    const done = ch.stages.filter((_, j) => stageDone(ch, j)).length;
    const b = button(
      (storyDone(ch) ? "✓ " : "") +
        ch.title +
        " · " +
        done +
        "/" +
        ch.stages.length,
      () => {
        chapter = i;
        stage = Math.max(
          0,
          ch.stages.findIndex((_, j) => !stageDone(ch, j)),
        );
        renderModes();
      },
      "btn" + (chapter === i ? " on" : ""),
    );
    b.title = (ch.tags || []).map((t) => TAG_NAMES[t] || t).join(" · ");
    box.appendChild(b);
  });
  tagBox.after(box);

  const panel = el("div", "row");
  panel.id = "storyStages";
  const ch = CHAPTERS[chapter];
  if (!ch) return;
  panel.appendChild(el("p", "stage-heading", ch.title + " · 故事内阶段"));
  if (!ch.stages[stage] || (stage > 0 && !stageDone(ch, stage - 1))) {
    stage = Math.max(
      0,
      ch.stages.findIndex((_, j) => !stageDone(ch, j)),
    );
  }
  ch.stages.forEach((st, j) => {
    const b = button(
      (stageDone(ch, j) ? "✓ " : "") + "阶段 " + (j + 1) + " · " + st.title,
      () => {
        stage = j;
        renderModes();
      },
      "btn" + (stage === j ? " on" : ""),
    );
    b.disabled = j > 0 && !stageDone(ch, j - 1);
    panel.appendChild(b);
  });
  box.after(panel);
}

/* 每日档案：只列出今天与过去，未来预备题不显示 */
function renderDailyArchive() {
  const box = $("dailyArchive");
  box.classList.toggle("hidden", mode !== "daily");
  box.replaceChildren();
  box.appendChild(el("p", null, "每日档案 · 北京时间（可补做往期）"));
  BANK.daily
    .filter((p) => p.date <= dayKey())
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date))
    .forEach((p) => {
      const status = (REC.daily || []).includes(p.date)
        ? "已通关"
        : REC.done.includes(p.id)
          ? "已查看"
          : "未完成";
      box.appendChild(
        button(
          `${p.date} · ${THEME_NAMES[p.theme]} / ${DIFF_NAMES[p.diff]} · ${status}`,
          () => {
            mode = "daily";
            startGame({ ...hydrate(p, p.theme, p.diff), date: p.date });
          },
        ),
      );
    });
}

/* 进度码：Base64 编码 + 校验和，仅用于手动跨设备迁移 */
const SYNC_PREFIX = "ZBR3-";

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return btoa(bin).replace(/=+$/, "");
}

function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function checksum(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* 只导出进度字段；成就由这些字段重建，游玩流水不上传也不进码 */
function exportPayload() {
  return JSON.stringify({
    v: 3,
    d: [...new Set(REC.done || [])],
    w: [...new Set(REC.wins || [])],
    s: [...new Set(REC.story || [])],
    y: [...new Set(REC.daily || [])],
    t: REC.solved || {},
  });
}

function showSyncBox(label, value) {
  $("syncBox").classList.remove("hidden");
  $("syncLabel").textContent = label;
  $("syncText").value = value;
}

function doExport() {
  const body = b64enc(exportPayload());
  showSyncBox(
    "本地进度码 · 包含题目、成就进度与统计，不含游玩流水，不上传服务器",
    SYNC_PREFIX + body + "-" + checksum(body),
  );
  $("syncText").select();
  try {
    document.execCommand("copy");
  } catch (e) {}
}

function doImport() {
  showSyncBox("把另一台设备的同步码粘进来", "");
  $("syncText").focus();
}

function stringsOf(value) {
  if (!Array.isArray(value) || value.some((x) => typeof x !== "string"))
    throw new Error("Invalid progress");
  return [...new Set(value)];
}

function statsOf(data, compact) {
  const raw = (compact ? data.t : data.solved) || {};
  const solved = {};
  for (const key of Object.keys(DIFF_NAMES)) {
    const stat = raw[key];
    if (!stat) continue;
    const { n, best, total } = stat;
    if (
      !Number.isInteger(n) ||
      n < 0 ||
      !Number.isFinite(total) ||
      total < 0 ||
      !(best === null || (Number.isFinite(best) && best >= 0))
    )
      throw new Error("Invalid stats");
    solved[key] = { n, best, total };
  }
  return solved;
}

/* 校验并还原一份进度；任何字段不合法都拒绝导入，不覆盖本机档案 */
function decodeProgress(text) {
  const body = text.slice(5);
  const cut = body.lastIndexOf("-");
  if (cut < 0) throw syncError("incomplete");
  const payload = body.slice(0, cut),
    sum = body.slice(cut + 1);
  if (checksum(payload) !== sum) throw syncError("checksum");
  const data = JSON.parse(b64dec(payload));
  const compact = data.v === 3;
  const story = compact ? data.s : data.story || [];
  if (
    !Array.isArray(story) ||
    story.some((x) => !Number.isInteger(x) || x < 0 || x >= CHAPTERS.length)
  )
    throw new Error("Invalid story");
  return {
    solved: statsOf(data, compact),
    done: stringsOf((compact ? data.d : data.done) || []),
    wins: stringsOf((compact ? data.w : data.wins) || []),
    story: [...new Set(story)],
    daily: stringsOf((compact ? data.y : data.daily) || []),
    history: compact ? [] : Array.isArray(data.history) ? data.history : [],
  };
}

function syncError(code) {
  const error = new Error(code);
  error.code = code;
  return error;
}

function syncConfirm() {
  const txt = $("syncText").value.trim();
  if (!txt) return;
  if (!txt.startsWith("ZBR1-") && !txt.startsWith(SYNC_PREFIX))
    return alert("这不像是一个同步码。");
  try {
    REC = decodeProgress(txt);
  } catch (e) {
    return alert(
      e.code === "incomplete"
        ? "同步码不完整。"
        : e.code === "checksum"
          ? "同步码校验失败，可能复制时漏了字符。"
          : "同步码解析失败。",
    );
  }
  saveRec(REC);
  renderStats();
  $("syncBox").classList.add("hidden");
  alert("档案已导入。");
}

/* 事件绑定与启动 */
function bindEvents() {
  $("undoBtn").onclick = undoMove;
  $("resetBtn").onclick = resetBoard;
  $("listBtn").onclick = () => {
    renderList();
    $("puzzleList").classList.toggle("hidden");
  };

  document.querySelectorAll("[data-mode]").forEach((b) => {
    b.onclick = () => {
      mode = b.dataset.mode;
      renderModes();
    };
  });

  $("startBtn").onclick = () => startGame();
  $("checkBtn").onclick = check;
  $("giveUpBtn").onclick = giveUp;
  $("backBtn").onclick = backHome;

  $("exportBtn").onclick = doExport;
  $("importBtn").onclick = doImport;
  $("syncDo").onclick = syncConfirm;
  $("syncCancel").onclick = () => $("syncBox").classList.add("hidden");
  $("clearBtn").onclick = () => {
    if (confirm("清空本机的全部记录？同步码可以留着备份。")) resetRecords();
  };
}

function init() {
  bindEvents();
  renderChoices();
  renderStats();
}

init();

/* 调试用：控制台里可以查看当前题目状态 */
window.ZEBRA = {
  S,
  get REC() {
    return REC;
  },
};
