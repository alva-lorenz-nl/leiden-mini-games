<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莱顿逻辑馆 · 小猫斑马谜题</title>
<meta name="description" content="阿尔瓦写的逻辑谜题生成器，小猫专属的斑马游戏。五种难度、自动计时、档案可跨设备同步，每一题都保证唯一解。">
<meta name="tag" content="逻辑 · 推理">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#141110;--card:#1e1915;--card2:#241d17;--line:#3a2f24;--ink:#e9dfd0;
    --dim:#9a8b78;--amber:#e0a458;--amber2:#c98a3f;--good:#7fa86a;--bad:#c96a5a;
  }
  body{background:radial-gradient(circle at 50% 0%,#221b15,#141110 60%);color:var(--ink);
    font-family:"Noto Serif SC",Georgia,"Songti SC",serif;min-height:100vh;padding:26px 14px 70px;
    display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(880px,100%)}
  header{text-align:center;margin-bottom:22px}
  .kicker{font-size:10px;letter-spacing:.34em;color:var(--amber2);margin-bottom:10px}
  h1{font-size:23px;font-weight:600;letter-spacing:.1em}
  .sub{margin-top:8px;font-size:12px;color:var(--dim);letter-spacing:.06em}
  .rule{width:44px;height:1px;background:var(--line);margin:18px auto 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;
    transition:.18s;letter-spacing:.06em}
  .btn:hover{border-color:#5c4630;color:var(--amber)}
  .btn.primary{background:linear-gradient(180deg,#3a2c1d,#2a2015);border-color:#5c4630;color:var(--amber)}
  .btn.on{border-color:var(--amber2);color:var(--amber);background:#2e2418}
  .btn:disabled{opacity:.45;cursor:default}
  .label{font-size:11px;letter-spacing:.2em;color:var(--dim);margin:16px 0 9px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:12px;color:var(--dim);margin-bottom:12px;letter-spacing:.06em}
  .timer{font-variant-numeric:tabular-nums;color:var(--amber);font-size:14px}
  .intro{font-size:12.5px;color:var(--dim);line-height:1.9;margin-bottom:14px}

  table{border-collapse:separate;border-spacing:5px;width:100%;table-layout:fixed}
  th{font-size:10.5px;color:var(--dim);font-weight:400;letter-spacing:.08em;padding-bottom:2px}
  th.rowh{text-align:right;padding-right:8px;color:var(--amber2);width:64px;font-size:11px}
  td{padding:0}
  .cell{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;
    background:#1a1512;color:var(--ink);font-family:inherit;font-size:12px;cursor:pointer;
    transition:.15s;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell:hover{border-color:#5c4630}
  .cell.filled{background:#2b2118;color:var(--amber)}
  .cell.wrong{border-color:var(--bad);color:var(--bad);animation:shake .3s}
  .cell.right{border-color:var(--good);color:var(--good)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  .clues{margin-top:16px;font-size:12.5px;line-height:2.05;color:#cbbca6}
  .clues li{margin-left:20px;padding-left:2px}
  .clues li::marker{color:#6b5a44;font-size:11px}
  .q{margin-top:16px;padding:12px 14px;border-left:2px solid var(--amber2);
    background:#221a13;border-radius:0 8px 8px 0;font-size:13px;color:var(--amber)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .msg{font-size:12.5px;letter-spacing:.05em;min-height:18px}
  .msg.ok{color:var(--good)} .msg.no{color:var(--bad)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .stat b{display:block;font-size:19px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim);letter-spacing:.1em}

  .picker{position:fixed;inset:0;background:rgba(10,8,7,.72);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(3px)}
  .picker.on{display:flex}
  .picker .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;width:min(360px,100%);max-height:80vh;overflow:auto}
  .picker .tt{font-size:12px;color:var(--dim);letter-spacing:.14em;margin-bottom:12px;text-align:center}
  .picker .opt{display:block;width:100%;text-align:center;margin-bottom:8px;padding:11px;
    background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
    font-family:inherit;font-size:13px;cursor:pointer}
  .picker .opt:hover{border-color:var(--amber2);color:var(--amber)}
  .picker .opt.clr{color:var(--dim);font-size:12px}

  textarea{width:100%;height:76px;background:#1a1512;border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:11px;
    padding:10px;resize:vertical;line-height:1.6}
  .hidden{display:none!important}
  .hist{font-size:11.5px;color:var(--dim);line-height:1.9;margin-top:10px;max-height:150px;overflow:auto}
  footer{margin-top:30px;text-align:center;font-size:11px;color:#5f5546;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">LEIDEN LOGIC ROOM</div>
    <h1>小猫斑马谜题</h1>
    <div class="sub">阿尔瓦写的逻辑生成器 · 每题唯一解</div>
    <div class="rule"></div>
  </header>

  <!-- 首页 -->
  <section id="home">
    <div class="card">
      <div class="label">主题</div>
      <div class="row" id="themeRow"></div>
      <div class="label">难度</div>
      <div class="row" id="diffRow"></div>
      <div class="foot">
        <div class="msg" id="homeMsg"></div>
        <button class="btn primary" id="startBtn">开始推理 →</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="label">档案</div>
      <div class="stats" id="statBox"></div>
      <div class="hist" id="histBox"></div>
      <div class="foot">
        <div class="row">
          <button class="btn" id="exportBtn">导出同步码</button>
          <button class="btn" id="importBtn">导入同步码</button>
        </div>
        <button class="btn" id="clearBtn">清空档案</button>
      </div>
      <div id="syncBox" class="hidden" style="margin-top:12px">
        <div class="label" id="syncLabel">同步码（复制到别的设备粘贴导入）</div>
        <textarea id="syncText" spellcheck="false"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="syncDo">确认</button>
          <button class="btn" id="syncCancel">取消</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 谜题 -->
  <section id="game" class="hidden">
    <div class="card">
      <div class="meta">
        <div id="gameTitle">—</div>
        <div class="timer" id="timer">00:00</div>
      </div>
      <div class="intro" id="intro"></div>
      <table id="grid"></table>
      <div class="q" id="question"></div>
      <div class="foot">
        <div class="msg" id="gameMsg"></div>
        <div class="row">
          <button class="btn" id="giveUpBtn">看答案</button>
          <button class="btn" id="backBtn">回首页</button>
          <button class="btn primary" id="checkBtn">提交检查</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="label">线索</div>
      <ol class="clues" id="clues"></ol>
    </div>
  </section>

  <footer>莱顿小游戏柜 · 慢慢做，慢慢加</footer>
</div>

<div class="picker" id="picker">
  <div class="box">
    <div class="tt" id="pickerTitle"></div>
    <div id="pickerOpts"></div>
    <button class="btn" style="width:100%;margin-top:4px" id="pickerClose">取消</button>
  </div>
</div>

const META = BANK.meta, PUZ = BANK.puzzles;

const THEME_NAMES = {}; Object.keys(META).forEach(k=>THEME_NAMES[k]=META[k].title);
const DIFF_NAMES = {easy:"简单", normal:"普通", hard:"困难"};

/* 把精简题库还原成页面用的结构 */
function hydrate(p, theme, diff){
  const cats = {};
  p.k.forEach(c=> cats[c] = META[theme].cats[c]);
  return {
    id:p.id, theme_key:theme, theme:META[theme].title, intro:META[theme].intro,
    difficulty:diff, categories:cats, clue_count:p.n, clues:p.c,
    question:p.q, answer:p.a, solution:p.s
  };
}

const S = {
  theme: localStorage.getItem("zebra_theme") || "cat",
  diff: localStorage.getItem("zebra_diff") || "easy",
  cur: null,       // 当前题目
  assign: null,    // {类别: [null x5]}
  t0: 0, timerId: null, elapsed: 0, solved: false,
};

/* ---------------- 档案 ---------------- */
function loadRec(){
  try{
    const raw = localStorage.getItem("zebra_records");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {solved:{}, history:[], done:[]};
}
function saveRec(r){ localStorage.setItem("zebra_records", JSON.stringify(r)); }
let REC = loadRec();

function fmt(sec){
  sec = Math.round(sec);
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function renderStats(){
  const box = document.getElementById("statBox");
  box.innerHTML = "";
  ["easy","normal","hard"].forEach(d=>{
    const s = REC.solved[d] || {n:0, best:null, total:0};
    const avg = s.n ? fmt(s.total/s.n) : "—";
    const el = document.createElement("div");
    el.className = "stat";
    el.innerHTML = `<b>${s.n} 题</b><span>${DIFF_NAMES[d]} · 最快 ${s.best==null?"—":fmt(s.best)} · 平均 ${avg}</span>`;
    box.appendChild(el);
  });
  const h = document.getElementById("histBox");
  if(!REC.history.length){ h.textContent = "还没有记录。做一题，这里就会留下痕迹。"; }
  else{
    h.innerHTML = REC.history.slice(0,12).map(x=>
      `· ${x.time}　${THEME_NAMES[x.theme]||x.theme} / ${DIFF_NAMES[x.diff]||x.diff}　用时 ${fmt(x.sec)}`).join("<br>");
  }
}

  const tr = document.getElementById("themeRow");
  tr.innerHTML = "";
  Object.keys(THEME_NAMES).forEach(k=>{
    const b = document.createElement("button");
    b.className = "btn" + (S.theme===k?" on":"");
    b.textContent = THEME_NAMES[k];
    b.onclick = ()=>{ S.theme=k; localStorage.setItem("zebra_theme",k); renderChoices(); };
    tr.appendChild(b);
  });
  const dr = document.getElementById("diffRow");
  dr.innerHTML = "";
  Object.keys(DIFF_NAMES).forEach(k=>{
    const b = document.createElement("button");
    b.className = "btn" + (S.diff===k?" on":"");
    b.textContent = DIFF_NAMES[k];
    b.onclick = ()=>{ S.diff=k; localStorage.setItem("zebra_diff",k); renderChoices(); };
    dr.appendChild(b);
  });
}

function pickPuzzle(){
  const key = S.theme+"_"+S.diff;
  const list = PUZ[key] || [];
  if(!list.length) return null;
  const undone = list.filter(p=>!REC.done.includes(p.id));
  const pool = undone.length ? undone : list;
  const raw = pool[Math.floor(Math.random()*pool.length)];
  return hydrate(raw, S.theme, S.diff);
}

/* ---------------- 谜题 ---------------- */
function startGame(){
  const p = pickPuzzle();
  if(!p){ document.getElementById("homeMsg").textContent = "这个主题暂时没有题目。"; return; }
  S.cur = p;
  S.assign = {};
  Object.keys(p.categories).forEach(c=> S.assign[c] = new Array(5).fill(null));
  S.solved = false;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("gameTitle").textContent =
    `${THEME_NAMES[p.theme_key]||p.theme} · ${DIFF_NAMES[p.difficulty]||p.difficulty} · ${p.clue_count} 条线索`;
  document.getElementById("intro").textContent = p.intro;
  document.getElementById("question").textContent = "追问：" + p.question;
  document.getElementById("gameMsg").textContent = "";
  document.getElementById("gameMsg").className = "msg";
  document.getElementById("checkBtn").disabled = false;
  document.getElementById("giveUpBtn").disabled = false;

  const cl = document.getElementById("clues");
  cl.innerHTML = "";
  p.clues.forEach(t=>{ const li=document.createElement("li"); li.textContent=t; cl.appendChild(li); });

  renderGrid();
  startTimer();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderGrid(){
  const p = S.cur, tb = document.getElementById("grid");
  tb.innerHTML = "";
  const head = document.createElement("tr");
  head.appendChild(document.createElement("th"));
  for(let i=1;i<=5;i++){
    const th = document.createElement("th");
    th.textContent = "第"+i+"位";
    head.appendChild(th);
  }
  tb.appendChild(head);

  Object.keys(p.categories).forEach(cat=>{
    const tr = document.createElement("tr");
    const rh = document.createElement("th");
    rh.className = "rowh";
    rh.textContent = cat;
    tr.appendChild(rh);
    for(let i=0;i<5;i++){
      const td = document.createElement("td");
      const b = document.createElement("button");
      b.className = "cell";
      b.dataset.cat = cat; b.dataset.idx = i;
      const v = S.assign[cat][i];
      b.textContent = v || "·";
      if(v) b.classList.add("filled");
      b.onclick = ()=> openPicker(cat, i);
      td.appendChild(b);
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
}

let pickerCtx = null;
function openPicker(cat, idx){
  if(S.solved) return;
  pickerCtx = {cat, idx};
  document.getElementById("pickerTitle").textContent = `${cat} · 第 ${idx+1} 位`;
  const box = document.getElementById("pickerOpts");
  box.innerHTML = "";
  S.cur.categories[cat].forEach(v=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = v;
    b.onclick = ()=>{ setCell(cat, idx, v); closePicker(); };
    box.appendChild(b);
  });
  const c = document.createElement("button");
  c.className = "opt clr";
  c.textContent = "清空这一格";
  c.onclick = ()=>{ setCell(cat, idx, null); closePicker(); };
  box.appendChild(c);
  document.getElementById("picker").classList.add("on");
}
function closePicker(){ document.getElementById("picker").classList.remove("on"); pickerCtx=null; }

function setCell(cat, idx, v){
  // 同一类别里同一个值只能出现一次，若重复则清掉原来那格
  if(v){
    const old = S.assign[cat].indexOf(v);
    if(old >= 0 && old !== idx) S.assign[cat][old] = null;
  }
  S.assign[cat][idx] = v;
  renderGrid();
}

function startTimer(){
  clearInterval(S.timerId);
  S.t0 = Date.now(); S.elapsed = 0;
  document.getElementById("timer").textContent = "00:00";
  S.timerId = setInterval(()=>{
    S.elapsed = (Date.now()-S.t0)/1000;
    document.getElementById("timer").textContent = fmt(S.elapsed);
  }, 250);
}
function stopTimer(){ clearInterval(S.timerId); S.timerId = null; }

function check(){
  const p = S.cur;
  let allFilled = true, wrong = 0;
  Object.keys(p.categories).forEach(cat=>{
    p.categories[cat].forEach((v,i)=>{
      const mine = S.assign[cat][i];
      if(!mine){ allFilled = false; return; }
      if(mine !== p.solution[cat][i]) wrong++;
    });
  });
  const msg = document.getElementById("gameMsg");
  if(!allFilled){
    msg.className = "msg no";
    msg.textContent = "还有空格没填。慢慢来，不急。";
    return;
  }
  if(wrong > 0){
    msg.className = "msg no";
    msg.textContent = `有 ${wrong} 格不对。线索是够用的，再推一推。`;
    // 标红错误格
    document.querySelectorAll(".cell").forEach(b=>{
      const cat=b.dataset.cat, i=+b.dataset.idx, v=S.assign[cat][i];
      if(v && v !== p.solution[cat][i]) b.classList.add("wrong");
    });
    return;
  }
  // 全对
  S.solved = true;
  stopTimer();
  document.getElementById("checkBtn").disabled = true;
  document.getElementById("giveUpBtn").disabled = true;
  msg.className = "msg ok";
  msg.textContent = `全对！用时 ${fmt(S.elapsed)}。${p.question} —— 答案是「${p.answer.value}」。`;
  document.querySelectorAll(".cell").forEach(b=>b.classList.add("right"));
  record(S.elapsed, true);
}

function giveUp(){
  const p = S.cur;
  S.solved = true;
  stopTimer();
  Object.keys(p.categories).forEach(cat=>{
    S.assign[cat] = p.solution[cat].slice();
  });
  renderGrid();
  document.querySelectorAll(".cell").forEach(b=>b.classList.add("right"));
  document.getElementById("checkBtn").disabled = true;
  document.getElementById("giveUpBtn").disabled = true;
  const msg = document.getElementById("gameMsg");
  msg.className = "msg";
  msg.textContent = `答案是：${p.answer.value}。${p.question}`;
  record(S.elapsed, false);
}

function record(sec, ok){
  const p = S.cur;
  const d = p.difficulty;
  if(!REC.solved[d]) REC.solved[d] = {n:0,best:null,total:0};
  if(ok){
    const s = REC.solved[d];
    s.n++; s.total += sec;
    s.best = s.best==null ? sec : Math.min(s.best, sec);
  }
  if(!REC.done.includes(p.id)) REC.done.push(p.id);
  const now = new Date();
  REC.history.unshift({
    time: `${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`,
    theme: p.theme_key, diff: d, sec: Math.round(sec), ok
  });
  REC.history = REC.history.slice(0, 60);
  saveRec(REC);
  renderStats();
}

/* ---------------- 同步码 ---------------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b=>bin += String.fromCharCode(b));
  return btoa(bin).replace(/=+$/,"");
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s/g,""));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function checksum(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function doExport(){
  const payload = JSON.stringify({v:1, solved:REC.solved, done:REC.done, history:REC.history.slice(0,40)});
  const body = b64enc(payload);
  const code = "ZBR1-" + body + "-" + checksum(body);
  const box = document.getElementById("syncBox");
  box.classList.remove("hidden");
  document.getElementById("syncLabel").textContent = "同步码（复制到别的设备粘贴导入）";
  document.getElementById("syncText").value = code;
  document.getElementById("syncText").select();
  try{ document.execCommand("copy"); }catch(e){}
}
function doImport(){
  const box = document.getElementById("syncBox");
  box.classList.remove("hidden");
  document.getElementById("syncLabel").textContent = "把另一台设备的同步码粘进来";
  document.getElementById("syncText").value = "";
  document.getElementById("syncText").focus();
}
function syncConfirm(){
  const txt = document.getElementById("syncText").value.trim();
  if(!txt) return;
  if(txt.startsWith("ZBR1-")){
    const body = txt.slice(5);
    const cut = body.lastIndexOf("-");
    if(cut < 0) return alert("同步码不完整。");
    const payload = body.slice(0, cut), sum = body.slice(cut+1);
    if(checksum(payload) !== sum) return alert("同步码校验失败，可能复制时漏了字符。");
    try{
      const data = JSON.parse(b64dec(payload));
      REC.solved = data.solved || {};
      REC.done = data.done || [];
      REC.history = data.history || [];
      saveRec(REC); renderStats();
      document.getElementById("syncBox").classList.add("hidden");
      alert("档案已导入。");
    }catch(e){ alert("同步码解析失败。"); }
  } else {
    alert("这不像是一个同步码。");
  }
}

/* ---------------- 绑定 ---------------- */
document.getElementById("startBtn").onclick = startGame;
document.getElementById("checkBtn").onclick = check;
document.getElementById("giveUpBtn").onclick = giveUp;
document.getElementById("backBtn").onclick = ()=>{
  stopTimer();
  document.getElementById("game").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  renderStats();
};
document.getElementById("pickerClose").onclick = closePicker;
document.getElementById("picker").onclick = e=>{ if(e.target.id==="picker") closePicker(); };
document.getElementById("exportBtn").onclick = doExport;
document.getElementById("importBtn").onclick = doImport;
document.getElementById("syncDo").onclick = syncConfirm;
document.getElementById("syncCancel").onclick = ()=> document.getElementById("syncBox").classList.add("hidden");
document.getElementById("clearBtn").onclick = ()=>{
  if(confirm("清空本机的全部记录？同步码可以留着备份。")){
    REC = {solved:{}, history:[], done:[]};
    saveRec(REC); renderStats();
  }
};

renderChoices();
renderStats();

/* 调试用：控制台里可以查看当前题目状态 */
window.ZEBRA = { S, get REC(){return REC;} };
</script>
